  c.quizzes.push(quiz);
  toast(T("toast_quiz_created"));
  openManageQuizModal(courseId, quiz.id);
}

/* Authoring view for instructors/admin: shows existing questions (each
   removable) and a small form to append a new multiple-choice question.
   Mirrors the student-facing quiz UI (q-block/radio-row) so what's built
   here is exactly what students will see in openQuizModal. */
function openManageQuizModal(courseId, quizId){
  const c = courseById(courseId), q = c.quizzes.find(x=>x.id===quizId);
  if(!q) return;
  openModal(`
    <div class="modal-head"><h3>${state.lang==="ar"?q.title_ar:q.title_en}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <div style="font-size:12px; color:var(--text-muted); margin:-6px 0 14px;">${T("due_label")} ${fmtDate(q.due)}</div>
    <div class="field"><label>${T("quiz_scoring_label")}</label>
      <select onchange="setQuizScoringPolicy('${c.id}','${q.id}', this.value)">
        <option value="last" ${(q.scoringPolicy||"last")==="last"?"selected":""}>${T("scoring_last")}</option>
        <option value="highest" ${q.scoringPolicy==="highest"?"selected":""}>${T("scoring_highest")}</option>
        <option value="lowest" ${q.scoringPolicy==="lowest"?"selected":""}>${T("scoring_lowest")}</option>
      </select>
    </div>
    <div class="field"><label>${T("quiz_questions_label")}${q.questions.length ? ` · ${T("quiz_total_points_label",{n: q.questions.reduce((s,qq)=>s+(qq.points||1),0)})}` : ""}</label>
      ${q.questions.length ? q.questions.map((qq,i)=>`
        <div class="q-block" style="background:var(--surface-2); border-radius:9px; padding:12px; margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div style="flex:1;">
              <div class="q-of">${T("quiz_of",{a:i+1,b:q.questions.length})} · ${qq.points||1} ${T("points_label")}</div>
              <div class="q-title">${state.lang==="ar"?qq.q_ar:qq.q_en}</div>
              ${(state.lang==="ar"?qq.opts_ar:qq.opts_en).map((opt,oi)=>`
                <div style="font-size:12.5px; padding:4px 0; ${oi===qq.correct?"color:var(--accent-strong); font-weight:600;":"color:var(--text-muted);"}">${oi===qq.correct?ICONS.check:"—"} ${opt}</div>
              `).join("")}
            </div>
            <button class="btn small danger" onclick="removeQuizQuestion('${c.id}','${q.id}',${i})">${T("remove_question_btn")}</button>
          </div>
        </div>
      `).join("") : `<div class="empty-row" style="padding:10px;">${T("no_quiz_questions_yet")}</div>`}
    </div>
    <div class="field" style="background:var(--surface-2); border-radius:9px; padding:12px;">

      <input type="text" id="new-q-text" placeholder="${T("question_text_ph")}" style="margin-bottom:10px;"/>
      <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:6px;">${T("mark_correct_note")}</div>
      ${[0,1,2,3].map(i=>`
        <label class="radio-row" style="background:var(--surface);">
          <input type="radio" name="new-q-correct" value="${i}" ${i===0?"checked":""}/>
          <input type="text" id="new-q-opt${i}" placeholder="${T("option_n_label",{n:i+1})}" style="border:none; background:transparent; flex:1; font-size:13.5px; font-family:inherit; color:var(--text); outline:none;"/>
        </label>
      `).join("")}

      <button class="btn small" style="margin-top:6px;" onclick="addQuizQuestion('${c.id}','${q.id}')">${T("add_question_btn")}</button>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="link-btn" style="color:var(--critical);" onclick="openDeleteQuizConfirm('${c.id}','${q.id}')">${T("delete_quiz_btn")}</button>
      <button class="btn" onclick="closeModal()">${T("close_btn")}</button>
    </div>
  `, true);
}

function addQuizQuestion(courseId, quizId){
  const c = courseById(courseId), q = c.quizzes.find(x=>x.id===quizId);
  const text = document.getElementById("new-q-text").value.trim();
  const opts = [0,1,2,3].map(i=>document.getElementById("new-q-opt"+i).value.trim());
  const correctSel = document.querySelector('input[name="new-q-correct"]:checked');
  const correct = correctSel ? parseInt(correctSel.value) : -1;
  const pointsInput = document.getElementById("new-q-points");
  const points = pointsInput ? parseInt(pointsInput.value, 10) : 1;
  const filled = opts.filter(o=>o);
  if(!text || filled.length<2 || correct<0 || !opts[correct]){ toast(T("question_incomplete_note")); return; }
  // keep only the filled options, remapping the correct index if trailing blanks were dropped
  const keptOpts = [], indexMap = {};
  opts.forEach((o,i)=>{ if(o){ indexMap[i]=keptOpts.length; keptOpts.push(o); } });
  q.questions.push({ q_en:text, q_ar:text, opts_en:keptOpts, opts_ar:keptOpts, correct: indexMap[correct], points: (points && points>0) ? points : 1 });
  if(!q.announced){
    postAutoAnnouncement(courseId, "new_quiz_announcement_title", "new_quiz_announcement_body", {title: q.title_en, date: fmtDate(q.due)});
    q.announced = true;
  }
  toast(T("toast_question_added"));
  openManageQuizModal(courseId, quizId);
  render();
}

function removeQuizQuestion(courseId, quizId, index){
  const c = courseById(courseId), q = c.quizzes.find(x=>x.id===quizId);
  q.questions.splice(index, 1);
  toast(T("toast_question_removed"));
  openManageQuizModal(courseId, quizId);
  render();
}

function openDeleteQuizConfirm(courseId, quizId){
  const c = courseById(courseId), q = c.quizzes.find(x=>x.id===quizId);
  openModal(`
    <div class="modal-head"><h3>${T("delete_quiz_confirm_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:18px;">${T("delete_quiz_confirm_msg",{title: state.lang==="ar"?q.title_ar:q.title_en})}</p>
    <div class="modal-actions">
      <button class="btn" onclick="openManageQuizModal('${courseId}','${quizId}')">${T("cancel_btn")}</button>
      <button class="btn danger" onclick="deleteQuiz('${courseId}','${quizId}')">${T("delete_quiz_btn")}</button>
    </div>
  `);
}

function deleteQuiz(courseId, quizId){
  const c = courseById(courseId);
  c.quizzes = c.quizzes.filter(q=>q.id!==quizId);
  closeModal();
  toast(T("toast_quiz_deleted"));
  render();
}

function openQuizModal(courseId, quizId){
  const c = courseById(courseId), q = c.quizzes.find(x=>x.id===quizId);
  if(isPastDeadline(q.due)){ toast(T("quiz_deadline_passed")); return; }
  if(quizAttemptsFor(q, CURRENT_USER.student).length >= QUIZ_MAX_ATTEMPTS){ toast(T("no_attempts_left_note")); return; }
  openModal(`

function submitQuiz(courseId, quizId){
  const c = courseById(courseId), q = c.quizzes.find(x=>x.id===quizId);
  if(isPastDeadline(q.due)){ closeModal(); toast(T("quiz_deadline_passed")); return; }
  const sid = CURRENT_USER.student;
  const attempts = quizAttemptsFor(q, sid);
  if(attempts.length >= QUIZ_MAX_ATTEMPTS){ closeModal(); toast(T("no_attempts_left_note")); return; }
  let score = 0, total = 0;
  const answers = [];
  for(let i=0;i<q.questions.length;i++){
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const val = sel ? parseInt(sel.value) : -1;
    const pts = q.questions[i].points || 1;
    answers.push(val);
    total += pts;
    if(val === q.questions[i].correct) score += pts;
  }
  attempts.push({score, total, answers, at:TODAY});
  if(!q.results) q.results = {};
  q.results[sid] = computeEffectiveQuizResult(q, attempts);
  closeModal();
  toast(T("toast_submitted"));
  viewQuizResult(courseId, quizId);
  render();
  // Same reasoning as submit_homework: a student can't write the courses
  // row directly, so persist this one attempt through the RPC.
  sbRpc("submit_quiz_result", {
    p_course_id: courseId, p_quiz_id: quizId,
    p_result: q.results[sid]
  }).catch(e=> console.error("submit_quiz_result RPC failed:", e));
}

/* ------------------- homework quizzes (assignments with type:"quiz") -------------------
   Mirrors the standalone Quizzes feature above exactly, but reads/writes
   a.questions / a.submissions instead of q.questions / q.results, and
   persists through the existing submit_homework RPC (no new RPC needed —
   that function already just jsonb_sets whatever is handed to it into the
   calling student's own submissions[] slot). The effective result object
   uses the field name .grade (not .score) on purpose: subStatus,
   renderTabGradebook, assignmentsAverage, the CSV export, and
   printReportCard are all written generically against `.grade`, so a
   homework-quiz submission is indistinguishable from a file/text one to
   every piece of existing Gradebook code. */
function homeworkQuizAttemptsFor(a, sid){
  const r = a.submissions && a.submissions[sid];
  if(!r) return [];
  if(Array.isArray(r.attempts)) return r.attempts;
  return [{grade:r.grade, total:r.total, answers:r.answers, at:r.at || null}];
}

function computeEffectiveHomeworkQuizResult(a, attempts){
  if(!attempts.length) return null;
  const policy = a.scoringPolicy || "last";
  let chosen = attempts[attempts.length-1];
  if(policy==="highest") chosen = attempts.reduce((best,x)=> x.grade>best.grade ? x : best);
  else if(policy==="lowest") chosen = attempts.reduce((best,x)=> x.grade<best.grade ? x : best);
  return {grade:chosen.grade, total:chosen.total, answers:chosen.answers, at:chosen.at, attempts, feedback:null};
}

function recomputeHomeworkQuizResult(a, sid){
  const attempts = homeworkQuizAttemptsFor(a, sid);
  if(!attempts.length){ delete a.submissions[sid]; return; }
  a.submissions[sid] = computeEffectiveHomeworkQuizResult(a, attempts);
}

function setHomeworkQuizScoringPolicy(courseId, assignmentId, policy){
  const c = courseById(courseId), a = c.assignments.find(x=>x.id===assignmentId);
  if(!a) return;
  a.scoringPolicy = policy;
  Object.keys(a.submissions||{}).forEach(sid=> recomputeHomeworkQuizResult(a, sid));
  toast(T("toast_scoring_updated"));
  openManageHomeworkQuizModal(courseId, assignmentId);
}

function addHomeworkQuizQuestion(courseId, assignmentId){
  const c = courseById(courseId), a = c.assignments.find(x=>x.id===assignmentId);
  const text = document.getElementById("new-hq-text").value.trim();
  const opts = [0,1,2,3].map(i=>document.getElementById("new-hq-opt"+i).value.trim());
  const correctSel = document.querySelector('input[name="new-hq-correct"]:checked');
  const correct = correctSel ? parseInt(correctSel.value) : -1;
  const pointsInput = document.getElementById("new-hq-points");
  const points = pointsInput ? parseInt(pointsInput.value, 10) : 1;
  const filled = opts.filter(o=>o);
  if(!text || filled.length<2 || correct<0 || !opts[correct]){ toast(T("question_incomplete_note")); return; }
  const keptOpts = [], indexMap = {};
  opts.forEach((o,i)=>{ if(o){ indexMap[i]=keptOpts.length; keptOpts.push(o); } });
  a.questions.push({ q_en:text, q_ar:text, opts_en:keptOpts, opts_ar:keptOpts, correct: indexMap[correct], points: (points && points>0) ? points : 1 });
  // a.points mirrors the quiz's total so the generic (non-quiz-aware)
  // assignmentsAverage/gradebook/report-card math — all written against a
  // single shared a.points — stays correct for quiz-type homework too.
  a.points = a.questions.reduce((s,qq)=>s+(qq.points||1),0);
  if(!a.announced){
    postAutoAnnouncement(courseId, "new_homework_announcement_title", "new_homework_announcement_body", {title: a.title_en, date: fmtDate(a.due)});
    a.announced = true;
  }
  toast(T("toast_question_added"));
  openManageHomeworkQuizModal(courseId, assignmentId);
  render();
}

        ${opts.map((opt,oi)=>{
          const isCorrect = oi===qq.correct;
          const isPicked = oi===picked;
          const icon = isCorrect ? ICONS.check : (isPicked ? ICONS.xmark : "");
          const color = isCorrect ? "color:var(--accent-strong); font-weight:600;" : (isPicked ? "color:var(--critical); font-weight:600;" : "color:var(--text-muted);");
          const note = isPicked && !isCorrect ? ` <span style="font-weight:400; font-size:11px;">(${T("their_answer_note")})</span>` : "";
          return `<div style="display:flex; align-items:center; gap:6px; font-size:12.5px; padding:4px 0; ${color}">${icon||"—"} ${opt}${note}</div>`;
        }).join("")}
        ${picked==null || picked<0 ? `<div style="font-size:11.5px; color:var(--critical); margin-top:4px;">${T("no_answer_given")}</div>` : ""}
      </div>`;
    }).join("")}
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="link-btn" onclick="${backAction}">${state.lang==="ar"?"→":"←"} ${T("back_to_results_btn")}</button>
      <button class="btn" onclick="closeModal()">${T("close_btn")}</button>
    </div>
  `, true);
}
</script>

<script>
/* ---------------------------- attendance tab ---------------------------- */
function renderTabAttendance(c){
  if(state.role==="student" || state.role==="parent"){
    const sid = activeStudentId();
    const recorded = c.attendance.filter(s=>s.records[sid] && s.records[sid]!=="unmarked");
    const rows = recorded.map(s=>s.records[sid]);
    const present = rows.filter(r=>r==="present"||r==="late").length;
    const rate = rows.length ? Math.round((present/rows.length)*100) : null;
    return `
      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:4px;">
        <div class="stat-tile"><div class="label">${T("overall_rate")}</div><div class="value">${rate!=null?rate+"<small>%</small>":"—"}</div></div>
      </div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>${T("session_date")}</th><th>${T("nav_courses")}</th></tr></thead>
        <tbody>${c.attendance.filter(s=>s.records[sid]).map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${pillForAtt(s.records[sid])}</td></tr>`).join("") || `<tr><td colspan="2">${T("no_sessions")}</td></tr>`}</tbody>
      </table></div>
    `;
  }
  // instructor / admin
  if(!state.attDate) state.attDate = c.attendance.length ? c.attendance[c.attendance.length-1].date : TODAY;
  let session = c.attendance.find(s=>s.date===state.attDate);
  const isNew = !session;
  const dates = c.attendance.map(s=>s.date);
  return `
    <div class="section-head">
      <div class="chip-row">
        ${dates.map(d=>`<button class="date-chip ${state.attDate===d?"active":""}" onclick="setState({attDate:'${d}'})">${fmtDate(d)}</button>`).join("")}
        <button class="date-chip" onclick="setState({attDate:'${TODAY}'})">${T("new_session")} (${fmtDate(TODAY)})</button>
      </div>
      <button class="btn small" onclick="exportAttendanceCsv('${c.id}')">${ICONS.file}${T("export_csv_btn")}</button>
    </div>
    <div class="att-grid">
      ${c.students.map(sid=>{
        const val = session ? (session.records[sid]||"present") : "present";
        const hasParentPhone = findParentsForStudent(sid).some(p=>p.phone);
        const auto = session && session.auto && session.auto[sid];
        return `<div class="att-row">
          <div class="avatar">${initials(userName(sid))}</div>
          <div class="an">${userName(sid)}${auto ? `<div style="font-size:10.5px; font-weight:400; color:var(--text-faint);">${T("att_auto_present_note")}</div>` : ""}${val==="unmarked" ? `<div style="font-size:10.5px; font-weight:600; color:var(--critical);">${T("att_unmarked_note")}</div>` : ""}</div>
          <div class="seg" data-student="${sid}">
            <button class="att-opt ${val==="present"?"on present":""}" data-val="present" onclick="setAttLocal(this,'present')">${T("present")}</button>
            <button class="att-opt ${val==="late"?"on late":""}" data-val="late" onclick="setAttLocal(this,'late')">${T("late")}</button>
            <button class="att-opt ${val==="absent"?"on absent":""}" data-val="absent" onclick="setAttLocal(this,'absent')">${T("absent")}</button>
            <button class="att-opt ${val==="absent_cause"?"on absent_cause":""}" data-val="absent_cause" onclick="setAttLocal(this,'absent_cause')">${T("absent_with_cause")}</button>
          </div>
          ${(val==="absent"||val==="absent_cause") && hasParentPhone ? `<button class="btn small" title="${T("notify_absence_title")}" onclick="openNotifyAbsenceModal('${sid}','${c.id}')">${ICONS.bell}${T("notify_parent_btn")}</button>` : ""}
        </div>`;
      }).join("")}
    </div>
    <div class="modal-actions" style="justify-content:flex-start; margin-top:14px;">
      <button class="btn primary" onclick="saveAttendance('${c.id}')">${T("save_attendance")}</button>
    </div>
  `;
}
function pillForAtt(v){
  if(v==="present") return `<span class="pill good">${ICONS.check}${T("present")}</span>`;
  if(v==="late") return `<span class="pill warning">${ICONS.clock}${T("late")}</span>`;
  if(v==="absent_cause") return `<span class="pill info">${T("absent_with_cause")}</span>`;
  if(v==="unmarked") return `<span class="pill neutral">${T("att_unmarked_label")}</span>`;
  return `<span class="pill critical">${T("absent")}</span>`;
}
function setAttLocal(btn, val){
  const seg = btn.parentElement;
  seg.querySelectorAll(".att-opt").forEach(b=>{ b.className = "att-opt" + (b.dataset.val===val ? " on "+val : ""); });
}
function saveAttendance(courseId){
  const c = courseById(courseId);
  let session = c.attendance.find(s=>s.date===state.attDate);
  if(!session){ session = {date: state.attDate, records:{}}; c.attendance.push(session); c.attendance.sort((a,b)=>a.date.localeCompare(b.date)); }
  document.querySelectorAll(".att-grid .seg").forEach(seg=>{
    const sid = seg.dataset.student;
    const on = seg.querySelector(".att-opt.on");
    // If the teacher never touched a student's toggle (e.g. it was showing
    // "unmarked" from the 2-day auto-lock, which has no pre-selected
    // button), keep whatever was already stored instead of silently
    // defaulting them to "present" — only an explicit click should turn
    // an unresolved day into a real attendance mark.
    session.records[sid] = on ? on.dataset.val : (session.records[sid] || "present");
    if(on && session.auto) delete session.auto[sid];
  });
  toast(T("toast_attendance"));
  render();
}

function exportAttendanceCsv(courseId){
  const c = courseById(courseId);
  if(!c) return;
  const header = ["Date", ...c.students.map(sid=>userName(sid))];
  const body = c.attendance.map(s=> [s.date, ...c.students.map(sid=> s.records[sid] || "")]);
  downloadCsv(`attendance-${c.code}.csv`, [header, ...body]);
}

/* ---------------------------- announcements tab (course-level) ---------------------------- */
function renderTabAnnouncements(c){
  const canPost = state.role==="instructor" || isAdminLike(state.role);
  return `
    ${canPost ? `<div class="section-head" style="margin-bottom:2px;"><span></span><button class="btn primary small" onclick="openNewAnnouncementModal('${c.id}')">${ICONS.announcements}${T("new_announcement")}</button></div>` : ""}
    <div class="list-card">
      ${c.announcements.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(an=>`
        <div class="list-row" style="align-items:flex-start;">
          <div class="lr-icon">${ICONS.announcements}</div>
          <div class="lr-main">
            <div class="lr-title">${state.lang==="ar"?an.title_ar:an.title_en}</div>
            <div class="lr-sub" style="margin-bottom:4px;">${fmtDate(an.date)}</div>
            <div style="font-size:13px; line-height:1.5;">${state.lang==="ar"?an.body_ar:an.body_en}</div>
          </div>
        </div>`).join("") || `<div class="empty-row">${T("no_announcements")}</div>`}
    </div>
  `;
}

function openNewAnnouncementModal(courseId){
  const list = coursesForCurrentUser();
  const options = courseId ? "" : list.map(c=>`<option value="${c.id}">${c.code} — ${courseTitle(c)}</option>`).join("");
  openModal(`
    <div class="modal-head"><h3>${T("new_announcement")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    ${courseId ? "" : `<div class="field"><label>${T("nav_courses")}</label><select id="ann-course">${options}<option value="">${T("institution_wide")}</option></select></div>`}
    <div class="field"><label>${T("description_label")}</label><input type="text" id="ann-title" placeholder="${T("announcement_title_ph")}"/></div>
    <div class="field"><label>${T("your_submission")}</label><textarea id="ann-body" placeholder="${T("announcement_body_ph")}"></textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="postAnnouncement('${courseId||""}')">${T("post_announcement")}</button>
    </div>
  `);
}

function postAnnouncement(fixedCourseId){
  const title = document.getElementById("ann-title").value.trim();
  const body = document.getElementById("ann-body").value.trim();
  if(!title || !body){ toast(state.lang==="ar"?"يرجى تعبئة جميع الحقول":"Please fill in all fields."); return; }
  const courseId = fixedCourseId || (document.getElementById("ann-course") ? document.getElementById("ann-course").value : null);
  const entry = {id:uid("an"), title_en:title, title_ar:title, body_en:body, body_ar:body, date:TODAY};
  if(courseId){ courseById(courseId).announcements.unshift(entry); }
  else{ entry.author_en = "Administration"; entry.author_ar = "الإدارة"; INSTITUTION_ANNOUNCEMENTS.unshift(entry); }
  closeModal();
  toast(T("toast_posted"));
  render();
}
</script>

<script>
/* ---------------------------- discussions hub (all courses) ---------------------------- */
function renderDiscussionsHub(){
  const list = coursesForCurrentUser();
  const threads = allThreadsFor(list);
  return `
    <div class="page-head"><div><h1>${T("nav_discussions")}</h1><div class="sub">${termSubLabel()}</div></div></div>

      ${threads.length ? threads.map(({course, thread})=>`

    </div>

      ${rows.length ? rows.map(announcementRow).join("") : emptyState(ICONS.announcements, T("no_announcements"), "")}

/* ---------------------------- admin: classes ---------------------------- */
function renderClassesAdmin(){
  // Same hard guard as renderUsersAdmin() — this page is really a
  // per-class roster + "manage account" browser, so it's admin-only too.
  if(state.role!=="admin") return renderDashboard();
  return `
    <div class="page-head">
      <div><h1>${T("nav_classes")}</h1><div class="sub">${T("classes_page_sub")}</div></div>
    </div>
    ${GRADE_LEVELS.map(level=>{
      const items = CLASSES.filter(c=>c.level===level.key);

    <div class="modal-head"><h3>${T("roster_title",{cls:classLabel(cls)})}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>

      <thead><tr><th>${T("name_label")}</th><th>${T("username_label")}</th><th>${T("status_label")}</th><th></th></tr></thead>
      <tbody>${students.map(u=>`
        <tr>
          <td><div style="display:flex; align-items:center; gap:9px;"><div class="avatar">${initials(state.lang==="ar"?u.name_ar:u.name_en)}</div>${state.lang==="ar"?u.name_ar:u.name_en}</div></td>
          <td class="grade-fig">${u.username||"—"}</td>
          <td>${u.active!==false ? `<span class="pill good">${ICONS.check}${T("status_active")}</span>` : `<span class="pill critical">${T("status_inactive")}</span>`}</td>
          <td><button class="btn small" onclick="openEditUserModal('${u.id}')">${T("manage_account")}</button></td>
        </tr>`).join("") || `<tr><td colspan="4">${T("no_students_class")}</td></tr>`}</tbody>

      <button class="btn" onclick="closeModal()">${T("close_btn")}</button>

}

/* ---------------------------- admin: role permissions ---------------------------- */
function renderPermissionsAdmin(){
  // Hard guard (see renderClassesAdmin/renderUsersAdmin above) — this page
  // only ever appears in the sidebar for the literal admin, but a direct
  // go('permissions') from anywhere else must not render it either.
  if(state.role!=="admin") return renderDashboard();
  const activeRole = PERMISSION_ROLES.includes(state.permissionsRole) ? state.permissionsRole : "manager";
  return `
    <div class="page-head">
      <div><h1>${T("nav_permissions")}</h1><div class="sub">${T("permissions_page_sub")}</div></div>
    </div>
    <div class="tabs" style="margin-bottom:16px;">
      ${PERMISSION_ROLES.map(r=>`<button class="tab-btn ${activeRole===r?"active":""}" onclick="setState({permissionsRole:'${r}'})">${T(roleLabelKey(r))}</button>`).join("")}
    </div>
    <div class="list-card">
      ${PERMISSION_SECTIONS.map(sec=>{
        const visible = roleSectionVisible(activeRole, sec.key);
        return `
        <div class="list-row">
          <div class="lr-main"><div class="lr-title">${T(sec.labelKey)}</div></div>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;">
            <input type="checkbox" ${visible?"checked":""} onchange="toggleRolePermission('${activeRole}','${sec.key}')"/>
            ${visible ? T("permissions_visible_label") : T("permissions_hidden_label")}
          </label>
        </div>`;
      }).join("")}
    </div>
    <p style="font-size:12px; color:var(--text-muted); margin-top:12px;">${T("permissions_page_note")}</p>
    ${!FEATURE_FLAGS.rolePermissions ? `<p class="boot-error" style="margin-top:10px;">${T("permissions_migration_needed")}</p>` : ""}
  `;
}
function roleLabelKey(role){
  return {student:"role_student", instructor:"role_instructor", admin:"role_admin", parent:"role_parent", staff:"role_staff", manager:"role_manager", itsupport:"role_itsupport"}[role];
}

/* ---------------------------- IT support ---------------------------- */
function renderItSupportPage(){
  // Admin always has it; anyone else only if roleSectionVisible granted
  // it via the Permissions page above (see navItems()'s own identical
  // check — this is the server-side-equivalent guard for a direct
  // go('itsupport') bypassing the sidebar).
  const allowed = state.role==="admin" || state.role==="itsupport" || (PERMISSION_ROLES.includes(state.role) && roleSectionVisible(state.role, "itsupport"));
  if(!allowed) return renderDashboard();
  const tab = ["contact","status","tickets"].includes(state.itsupportTab) ? state.itsupportTab : "contact";
  return `
    <div class="page-head">
      <div><h1>${T("nav_itsupport")}</h1><div class="sub">${T("itsupport_page_sub")}</div></div>
    </div>
    <div class="tabs" style="margin-bottom:16px;">
      <button class="tab-btn ${tab==="contact"?"active":""}" onclick="setState({itsupportTab:'contact'})">${T("itsupport_tab_contact")}</button>
      <button class="tab-btn ${tab==="status"?"active":""}" onclick="setState({itsupportTab:'status'})">${T("itsupport_tab_status")}</button>
      <button class="tab-btn ${tab==="tickets"?"active":""}" onclick="setState({itsupportTab:'tickets'})">${T("itsupport_tab_tickets")}</button>
    </div>
    ${tab==="contact" ? renderItSupportContact() : tab==="status" ? renderItSupportStatus() : renderItSupportTickets()}
  `;
}
function renderItSupportContact(){
  const admin = Object.values(USERS).find(u=>u.role==="admin");
  return `
    <div class="list-card" style="padding:18px;">
      <h3 style="margin-bottom:8px;">${T("itsupport_contact_title")}</h3>
      <p style="font-size:13px; color:var(--text-muted); line-height:1.7;">${T("itsupport_contact_body")}</p>
      ${admin ? `<p style="font-size:13px; margin-top:10px;"><b>${T("itsupport_contact_person")}:</b> ${escapeHtml(state.lang==="ar"?admin.name_ar:admin.name_en)}${admin.phone ? " · "+escapeHtml(admin.phone) : ""}</p>` : ""}
    </div>
  `;
}
function renderItSupportStatus(){
  const rows = [
    [T("itsupport_status_sync"), cloudSyncEnabled ? T("itsupport_status_ok") : T("itsupport_status_off")],
    [T("itsupport_status_loaded"), lastDataLoadAt ? fmtDateTime(lastDataLoadAt.toISOString()) : "—"],
    [T("itsupport_status_users"), String(Object.keys(USERS).length)],
    [T("itsupport_status_courses"), String(COURSES.length)],
    [T("itsupport_status_online"), String(ONLINE_CLASSES.length)],
    [T("itsupport_status_permissions_table"), FEATURE_FLAGS.rolePermissions ? T("itsupport_status_ok") : T("itsupport_status_missing")],
    [T("itsupport_status_tickets_table"), FEATURE_FLAGS.itTickets ? T("itsupport_status_ok") : T("itsupport_status_missing")],
    [T("itsupport_status_boot_error"), bootError || "—"],
  ];
  return `
    <div class="table-wrap"><table class="data-table">
      <tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</tbody>
    </table></div>
    ${(!FEATURE_FLAGS.rolePermissions || !FEATURE_FLAGS.itTickets) ? `<p class="boot-error" style="margin-top:10px;">${T("permissions_migration_needed")}</p>` : ""}
  `;
}
function renderItSupportTickets(){
  const rows = IT_TICKETS.slice().sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""));
  return `
    <div class="page-head" style="margin-bottom:10px;">
      <div class="sub">${T("itsupport_tickets_sub")}</div>
      <button class="btn primary" onclick="openNewTicketModal()">${T("itsupport_new_ticket_btn")}</button>
    </div>
    <div class="list-card">
      ${rows.length ? rows.map(ticketRow).join("") : emptyState(ICONS.help, T("itsupport_no_tickets"), "")}
    </div>
  `;
}
function ticketStatusPill(status){
  if(status==="resolved") return `<span class="pill good">${ICONS.check}${T("itsupport_ticket_resolved")}</span>`;
  if(status==="in_progress") return `<span class="pill info">${ICONS.clock}${T("itsupport_ticket_in_progress")}</span>`;
  return `<span class="pill neutral">${T("itsupport_ticket_open")}</span>`;
}
// fmtDate() expects a plain "YYYY-MM-DD" string (it appends its own
// T00:00:00) — tickets store a full ISO timestamp instead, since knowing
// what time an issue came in actually matters here, so this formats that
// directly rather than reusing fmtDate.
function fmtDateTime(iso){
  if(!iso) return "—";
  try{
    return new Date(iso).toLocaleString(state.lang==="ar"?"ar":"en-US", {dateStyle:"medium", timeStyle:"short"});
  }catch(e){ return iso; }
}
function ticketRow(t){
  return `
    <div class="list-row" style="cursor:pointer" onclick="openEditTicketModal('${t.id}')">
      <div class="lr-icon">${ICONS.help}</div>
      <div class="lr-main"><div class="lr-title">${escapeHtml(t.title)}</div><div class="lr-sub">${fmtDateTime(t.createdAt)}</div></div>
      ${ticketStatusPill(t.status)}
    </div>`;
}
function openNewTicketModal(){
  openModal(`
    <div class="modal-head"><h3>${T("itsupport_new_ticket_btn")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <div class="field"><label>${T("description_label")}</label><input type="text" id="ticket-title" placeholder="${T("itsupport_ticket_title_ph")}"/></div>
    <div class="field"><label>${T("your_submission")}</label><textarea id="ticket-desc" placeholder="${T("itsupport_ticket_desc_ph")}"></textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="saveNewTicket()">${T("post_announcement")}</button>
    </div>
  `);
}
function saveNewTicket(){
  const title = document.getElementById("ticket-title").value.trim();
  const desc = document.getElementById("ticket-desc").value.trim();
  if(!title){ toast(state.lang==="ar"?"يرجى تعبئة جميع الحقول":"Please fill in all fields."); return; }
  const now = new Date().toISOString();
  IT_TICKETS.unshift({id:uid("tk"), title, description:desc, status:"open", createdAt:now, updatedAt:now, createdBy: CURRENT_USER[state.role]});
  closeModal();
  toast(T("toast_posted"));
  render();
}
function openEditTicketModal(id){
  const t = IT_TICKETS.find(x=>x.id===id);
  if(!t) return;
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(t.title)}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:13px; color:var(--text-muted); white-space:pre-wrap;">${escapeHtml(t.description||"")}</p>
    <div class="field"><label>${T("status_label")}</label>
      <select id="ticket-status">

/* ---------------------------- unified calendar ----------------------------
   A week view that layers three data sources that otherwise live on three
   separate pages: the recurring weekly Timetable (day-of-week keyed, no
   real dates), assignment/quiz due dates (real ISO dates, via the same
   coursesForCurrentUser() every other page uses), and Online Classes
   sessions (also real ISO dates, via sessionsForCurrentUser()). Periods are
   resolved per-role exactly like the Timetable page already does — a
   student/parent's own class, an instructor's aggregated teaching periods
   across every class (same lookup as renderTeacherTimetable), an admin's
   picked class — so this page never re-derives scheduling rules, it only
   re-presents the existing ones on a date grid. */
function isoDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function defaultCalendarWeekStart(){
  const d = new Date(TODAY+"T00:00:00");
  const dow = d.getDay();
  const offset = dow===5 ? 2 : dow===6 ? 1 : -dow;
  d.setDate(d.getDate()+offset);
  return isoDate(d);
}
function calendarPeriodFor(dayKey, perKey){
  if(state.role==="instructor"){
    const tid = CURRENT_USER.instructor;
    for(const cls of CLASSES){
      const cell = TIMETABLE[cls.id][dayKey][perKey];
      if(cell && cell.teacherId===tid) return {label:(state.lang==="ar"?cell.subjectAr:cell.subjectEn), sub:classLabel(cls)};
    }
    return null;
  }
  let classId = null;
  if(state.role==="student") classId = USERS[CURRENT_USER.student].classId;
  else if(state.role==="parent"){ const sid=viewedStudentId(); classId = sid?USERS[sid].classId:null; }
  else if(isAdminLike(state.role)) classId = state.calClassId || "G10";
  if(!classId) return null;
  const cell = TIMETABLE[classId][dayKey][perKey];
  return cell ? {label:(state.lang==="ar"?cell.subjectAr:cell.subjectEn), sub:userName(cell.teacherId)} : null;
}
function shiftCalendarWeek(dir){
  const start = new Date((state.calendarWeekStart||defaultCalendarWeekStart())+"T00:00:00");
  start.setDate(start.getDate()+dir*7);
  setState({calendarWeekStart: isoDate(start)});
}
function resetCalendarWeek(){ setState({calendarWeekStart: defaultCalendarWeekStart()}); }

function renderCalendarPage(){
  if(!state.calendarWeekStart) state.calendarWeekStart = defaultCalendarWeekStart();
  const start = new Date(state.calendarWeekStart+"T00:00:00");
  const weekDates = DAYS.map((d,i)=>{
    const dt = new Date(start); dt.setDate(start.getDate()+i);
    return {key:d.key, day:d, date: isoDate(dt)};
  });

  const courses = coursesForCurrentUser();
  const dueByDate = {};
  courses.forEach(c=>{
    c.assignments.forEach(a=>{ (dueByDate[a.due] = dueByDate[a.due]||[]).push({kind:"assignment", course:c, ref:a}); });
    c.quizzes.forEach(q=>{ (dueByDate[q.due] = dueByDate[q.due]||[]).push({kind:"quiz", course:c, ref:q}); });
  });
  const sessByDate = {};
  sessionsForCurrentUser().forEach(s=>{ (sessByDate[s.date]=sessByDate[s.date]||[]).push(s); });

  const upcomingEvents = SCHOOL_EVENTS.filter(e=>e.date >= TODAY).slice(0,5);
  return `
    <div class="page-head">
      <div><h1>${T("nav_calendar")}</h1><div class="sub">${T("calendar_sub")}</div></div>
      <div class="chip-row">
        ${isAdminLike(state.role) ? `<select style="margin-inline-end:8px;" onchange="setState({calClassId:this.value})">${classOptionsGrouped(state.calClassId)}</select>` : ""}
        <button class="btn small" onclick="shiftCalendarWeek(-1)" aria-label="${state.lang==="ar"?"→":"←"}">${state.lang==="ar"?"→":"←"}</button>
        <span class="grade-fig" style="align-self:center; padding:0 4px;">${fmtDate(weekDates[0].date)} – ${fmtDate(weekDates[weekDates.length-1].date)}</span>
        <button class="btn small" onclick="shiftCalendarWeek(1)" aria-label="${state.lang==="ar"?"←":"→"}">${state.lang==="ar"?"←":"→"}</button>
        <button class="btn small ghost" onclick="resetCalendarWeek()">${T("today_btn")}</button>
      </div>
    </div>
    ${upcomingEvents.length ? `
    <div class="chart-card" style="margin-bottom:16px;">
      <h3>${T("upcoming_academic_dates_title")}</h3>
      <div class="chip-row" style="margin-top:10px; flex-wrap:wrap;">
        ${upcomingEvents.map(ev=>`
          <span class="pill info" style="font-size:12px;">${fmtDate(ev.date)} · ${escapeHtml(state.lang==="ar"?ev.title_ar:ev.title_en)}</span>
        `).join("")}
      </div>
    </div>
    ` : ""}
    <div class="cal-grid">
      ${weekDates.map(wd=>{
        const isToday = wd.date===TODAY;
        const periodsHtml = PERIODS.map((per,i)=>{
          const p = calendarPeriodFor(wd.key, per.key);
          const block = p ? `<div class="cal-period"><span class="cal-period-n">${per.n}</span><span class="cal-period-info"><b>${escapeHtml(p.label)}</b><small>${escapeHtml(p.sub)}</small></span></div>` : "";
          return i===BREAK_AFTER_PERIOD_INDEX ? block + `<div class="cal-period cal-break"><span class="cal-period-info"><b>${T("break_label")}</b><small>${periodTimeRange(BREAK_TIME)}</small></span></div>` : block;
        }).join("");
        const due = dueByDate[wd.date]||[];
        const sess = sessByDate[wd.date]||[];
        const empty = !periodsHtml && !due.length && !sess.length;
        return `
        <div class="cal-day ${isToday?"today":""}">
          <div class="cal-day-head"><span>${state.lang==="ar"?wd.day.ar:wd.day.en}</span><span class="cal-day-date">${new Date(wd.date+"T00:00:00").getDate()}</span></div>
          <div class="cal-day-body">
            ${periodsHtml}
            ${due.map(it=>`<button class="cal-item due" onclick="openCourse('${it.course.id}','${it.kind==="quiz"?"quizzes":"assignments"}')">${it.kind==="quiz"?ICONS.reports:ICONS.file}<span>${escapeHtml(state.lang==="ar"?it.ref.title_ar:it.ref.title_en)}</span></button>`).join("")}
            ${sess.map(s=>`<button class="cal-item live-item ${s.status==="live"?"is-live":""}" onclick="go('online')">${ICONS.video}<span>${escapeHtml(state.lang==="ar"?s.title_ar:s.title_en)}</span></button>`).join("")}
            ${empty ? `<div class="cal-empty">${T("free_period")}</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function saveTimetableCell(classId, dayKey, periodKey){
  const subjEn = document.getElementById("tt-subject").value;
  const teacherId = document.getElementById("tt-teacher").value;
  if(!subjEn){ TIMETABLE[classId][dayKey][periodKey] = null; }
  else{
    const subj = SUBJECT_CATALOG.find(s=>s.en===subjEn);
    TIMETABLE[classId][dayKey][periodKey] = { subjectEn: subj.en, subjectAr: subj.ar, teacherId };
    // keep the teacher's assignment list (Users -> Manage) in sync with the grid
    const t = USERS[teacherId];
    if(t){
      if(!t.teaching) t.teaching = [];
      const exists = t.teaching.some(a=>a.classId===classId && a.subjectEn===subj.en);
      if(!exists) t.teaching.push({classId, subjectEn:subj.en, subjectAr:subj.ar});
    }
  }
  // If this edit was for today's day-of-week, make sure a same-day
  // substitution shows up in Online Classes immediately rather than
  // waiting for the next login (see autoGenerateTodaysOnlineClasses).
  autoGenerateTodaysOnlineClasses();
  closeModal();
  toast(T("toast_timetable_saved"));
  render();
}

function clearTimetableCell(classId, dayKey, periodKey){
  TIMETABLE[classId][dayKey][periodKey] = null;
  closeModal();
  toast(T("toast_timetable_saved"));
  render();
}

/* ---------------------------- admin: users ---------------------------- */
/* Landing on one flat table of every user (potentially hundreds across
   four very different roles) was the pain point here — so this splits
   into role categories up front (chips with live counts), remembers
   which one is selected, and narrows the table's columns to what's
   actually relevant to that role instead of one generic layout for
   everyone. A student gets a class picker on top since a school can have
   many classes; other categories are small enough that search covers it. */
function renderUsersAdmin(){
  // Staff is deliberately excluded from the whole Users section — this is a
  // hard guard, not just a hidden nav item, in case anything ever routes
  // here without going through the nav button.
  if(state.role!=="admin") return renderDashboard();
  const q = (state.usersFilter||"").trim().toLowerCase();
  const roleFilter = state.usersRoleFilter || "all";
  const classFilter = state.usersClassFilter || "";
  const subjectFilter = state.usersSubjectFilter || "";
  const roleLabel = r => T({student:"role_student", instructor:"role_instructor", admin:"role_admin", parent:"role_parent", staff:"role_staff", manager:"role_manager", itsupport:"role_itsupport"}[r]);

  const counts = {all:0, student:0, instructor:0, parent:0, admin:0, staff:0, manager:0, itsupport:0};
  Object.values(USERS).forEach(u=>{ counts.all++; counts[u.role] = (counts[u.role]||0) + 1; });
  const CATS = [
    {key:"all", label:T("users_cat_all")},
    {key:"student", label:T("users_cat_students")},
    {key:"instructor", label:T("users_cat_teachers")},
    {key:"parent", label:T("users_cat_parents")},
    {key:"admin", label:T("users_cat_admins")},
    {key:"staff", label:T("role_staff")},
    {key:"manager", label:T("role_manager")},
    {key:"itsupport", label:T("role_itsupport")},
  ];

  let users = Object.values(USERS).filter(u=>{
    const n = (state.lang==="ar"?u.name_ar:u.name_en).toLowerCase();
    return !q || n.includes(q) || u.name_en.toLowerCase().includes(q) || (u.username||"").includes(q);
  });
  if(roleFilter!=="all") users = users.filter(u=>u.role===roleFilter);
  if(roleFilter==="student" && classFilter) users = users.filter(u=>u.classId===classFilter);
  if(roleFilter==="instructor" && subjectFilter) users = users.filter(u=>(u.teaching||[]).some(a=>a.subjectEn===subjectFilter));
  users = users.slice().sort((a,b)=>{
    const an = state.lang==="ar"?a.name_ar:a.name_en, bn = state.lang==="ar"?b.name_ar:b.name_en;
    return an.localeCompare(bn, state.lang==="ar"?"ar":"en");
  });

  // Column set adapts to the selected category — "all" keeps the original
  // one-size-fits-all Role + Class column; a specific category swaps it
  // for whatever's actually useful (class for students, assignment count
  // for teachers, linked kids for parents, nothing extra for admins).
  let extraHeader, extraCell;
  if(roleFilter==="student"){
    extraHeader = T("class_column");
    extraCell = u => u.classId ? classLabel(classById(u.classId)) : T("unassigned");
  } else if(roleFilter==="instructor"){
    extraHeader = T("teaching_assignments_title");
    extraCell = u => (u.teaching&&u.teaching.length) ? T("teaching_count_label",{n:u.teaching.length}) : T("teaching_assignments_empty");
  } else if(roleFilter==="parent"){
    extraHeader = T("parent_children_title");
    extraCell = u => (u.children||[]).length ? u.children.map(cid=>USERS[cid]?userName(cid):null).filter(Boolean).join(", ") : T("no_children_linked");
  } else if(roleFilter==="admin" || roleFilter==="staff" || roleFilter==="itsupport"){
    extraHeader = null;
    extraCell = null;
  } else {
    extraHeader = T("class_column");
    extraCell = u => {
      const cls = u.classId ? classById(u.classId) : null;
      return cls ? classLabel(cls)
        : u.role==="student" ? T("unassigned")
        : u.role==="parent" ? ((u.children||[]).length ? u.children.map(cid=>USERS[cid]?userName(cid):null).filter(Boolean).join(", ") : T("no_children_linked"))
        : "—";
    };
  }
  const showRoleCol = roleFilter==="all";
  const showPhoneCol = roleFilter!=="student" && roleFilter!=="admin" && roleFilter!=="staff" && roleFilter!=="itsupport";

  return `
    <div class="page-head">
      <div><h1>${T("users_mgmt")}</h1><div class="sub">${Object.keys(USERS).length} ${state.lang==="ar"?"مستخدم":"total users"}</div></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="openImportUsersModal()">${ICONS.file}${T("import_users_btn")}</button>
        <button class="btn primary" onclick="openAddUserModal(${roleFilter!=="all" ? `'${roleFilter}'` : ""})">${ICONS.users}${roleFilter!=="all" ? T("add_role_btn",{role:roleLabel(roleFilter)}) : T("add_user")}</button>
      </div>
    </div>
    <div class="chip-row" style="margin-bottom:14px;">
      ${CATS.map(c=>`<button class="date-chip ${roleFilter===c.key?"active":""}" onclick="setState({usersRoleFilter:'${c.key}', usersClassFilter:'', usersSubjectFilter:''})">${c.label} <span style="opacity:.65;">(${counts[c.key]||0})</span></button>`).join("")}
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;">
      <div class="topbar-search" style="max-width:320px;">
        <input type="text" placeholder="${T("search_users_ph")}" value="${escapeHtml(state.usersFilter||"")}" oninput="setState({usersFilter:this.value})"/>
      </div>
      ${roleFilter==="student" ? `<select onchange="setState({usersClassFilter:this.value})">
        <option value="">${T("all_classes_label")}</option>
        ${classOptionsGrouped(classFilter)}
      </select>` : ""}
      ${roleFilter==="instructor" ? `<select onchange="setState({usersSubjectFilter:this.value})">
        <option value="">${T("all_subjects_label")}</option>
        ${SUBJECT_CATALOG.map(s=>`<option value="${escapeHtml(s.en)}" ${subjectFilter===s.en?"selected":""}>${state.lang==="ar"?s.ar:s.en}</option>`).join("")}
      </select>` : ""}
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr>
        <th>${T("name_label")}</th>
        ${showRoleCol ? `<th>${T("role_label")}</th>` : ""}
        <th>${T("username_label")}</th>
        ${extraHeader ? `<th>${extraHeader}</th>` : ""}
        ${showPhoneCol ? `<th>${T("phone_label")}</th>` : ""}
        <th>${T("status_label")}</th><th></th>
      </tr></thead>
      <tbody>${users.map(u=>`<tr>
          <td><div style="display:flex; align-items:center; gap:9px;"><div class="avatar">${initials(state.lang==="ar"?u.name_ar:u.name_en)}</div>${state.lang==="ar"?u.name_ar:u.name_en}</div></td>
          ${showRoleCol ? `<td><span class="pill ${(u.role==='admin'||u.role==='staff')?'gold':'neutral'}">${roleLabel(u.role)}</span></td>` : ""}
          <td class="grade-fig">${u.username||"—"}</td>
          ${extraCell ? `<td>${extraCell(u)}</td>` : ""}
          ${showPhoneCol ? `<td class="grade-fig" dir="ltr" style="text-align:${state.lang==="ar"?"right":"left"};">${u.phone?escapeHtml(u.phone):"—"}</td>` : ""}
          <td>${u.active!==false ? `<span class="pill good">${ICONS.check}${T("status_active")}</span>` : `<span class="pill critical">${T("status_inactive")}</span>`}</td>
          <td><button class="btn small" onclick="openEditUserModal('${u.id}')">${T("manage_account")}</button></td>
        </tr>`).join("") || `<tr><td colspan="7">${T("no_results")}</td></tr>`}</tbody>
    </table></div>
  `;
}

async function addUser(presetRole, presetClassId){
  const name = document.getElementById("new-user-name").value.trim();
  const role = presetRole || document.getElementById("new-user-role").value;
  if(!name){ toast(state.lang==="ar"?"يرجى إدخال الاسم":"Please enter a name."); return; }
  // Keep digits (0-9) here, not just letters — dropping them means e.g.
  // "Test Student" and "Test Student 2" both slug down to the identical
  // "test.student". That collision doesn't even surface as an error: Supabase
  // silently no-ops a signup to an already-registered email (by design, to
  // stop email enumeration), so the "new" account creation looked successful
  // but created nothing. Digits are the easiest way for an admin to
  // disambiguate two similarly-named people, so they need to survive here.
  const usernameBase = name.trim().toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g,".").replace(/^\.+|\.+$/g,"") || "user";
  const extra = {};
  if(role==="student" && presetClassId) extra.class_id = presetClassId;
  if(role==="parent"){
    extra.children = Array.from(document.querySelectorAll(".new-user-child-cb:checked")).map(cb=>cb.value);
  }
  if(role==="instructor" || role==="parent"){
    const phoneEl = document.getElementById("new-user-phone");
    const phone = phoneEl ? phoneEl.value.trim() : "";
    if(phone) extra.phone = phone;
  }
  closeModal();
  toast(T("toast_creating_account"));
  try{
    const { id, username } = await createRealAccount({ username: usernameBase, password: NEW_USER_DEFAULT_PASSWORD, role, name_en:name, name_ar:name, ...extra });
    if(role==="student" && presetClassId){ const cls = classById(presetClassId); if(cls) cls.students.push(id); }
    await loadAllData();
    render();
    openAccountCreatedModal({ name, username, password: NEW_USER_DEFAULT_PASSWORD });
  }catch(e){
    toast(T("toast_create_account_failed"));
  }
}

function parseCsvText(text){
  const lines = text.split(/\r\n|\n|\r/).map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length) return [];
  const header = lines[0].split(",").map(h=>h.trim().toLowerCase());
  let nameIdx = header.indexOf("name");
  let roleIdx = header.indexOf("role");
  let classIdx = header.findIndex(h=>h==="class" || h==="classid" || h==="class_id");
  const hasHeader = nameIdx!==-1 || roleIdx!==-1 || classIdx!==-1;
  if(!hasHeader){ nameIdx=0; roleIdx=1; classIdx=2; }
  const dataLines = hasHeader ? lines.slice(1) : lines;
  const knownRoles = ["student","instructor","admin","parent","staff"];
  const usedUsernames = new Set(Object.values(USERS).map(u=>u.username));
  return dataLines.map(line=>{
    const cols = line.split(",").map(c=>c.trim());
    const name = nameIdx>=0 ? (cols[nameIdx]||"") : "";
    const roleRaw = roleIdx>=0 ? (cols[roleIdx]||"").toLowerCase() : "";
    const classRaw = classIdx>=0 ? (cols[classIdx]||"") : "";
    let error = "";
    if(!name) error = T("csv_error_no_name");
    else if(!knownRoles.includes(roleRaw)) error = T("csv_error_bad_role");
    else if(roleRaw==="student" && classRaw && !classById(classRaw)) error = T("csv_error_bad_class");
    return {
      name, role: knownRoles.includes(roleRaw) ? roleRaw : roleRaw, classId: classRaw || null,
      valid: !error, error,
      _usernameHint: (()=>{
        // Same fix as addUser() above — keep digits, or two rows like
        // "Ali Hassan" and "Ali Hassan 2" collide into one username.
        let base = name.trim().toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g,".").replace(/^\.+|\.+$/g,"") || "user";
        let candidate = base, n = 1;
        while(usedUsernames.has(candidate)){ candidate = base+"."+(++n); }
        usedUsernames.add(candidate);
        return candidate;
      })()
    };
  });
}

function handleCsvFileSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    csvImportRows = parseCsvText(String(reader.result||""));
    renderImportUsersModal();
  };
  reader.readAsText(file);
}

/* Admin sets a brand-new password for someone else's account — the one
   credential change self-service can't cover. Goes through the
   admin-set-password Edge Function (see the Supabase client module),

   only ever carries the admin's own session token. */

    await sbAdminSetPassword(userId, p1);

/* Admin changes someone else's username — goes through the
   admin-set-username Edge Function (see the Supabase client module),
   which updates both the real Auth login email and profiles.username
   together, so a page refresh never leaves the two disagreeing about
   what this person's current username actually is. */
async function submitAdminSetUsername(userId){
  const u = USERS[userId];
  const input = document.getElementById("edit-username");
  const newUsername = (input ? input.value : "").trim().toLowerCase();
  if(!newUsername || !/^[a-z0-9.؀-ۿ]{2,64}$/.test(newUsername)){ toast(T("toast_username_invalid")); return; }
  if(newUsername === (u.username||"").toLowerCase()) return;
  const btn = document.getElementById("admin-set-username-btn");
  if(btn) btn.disabled = true;
  try{
    await sbAdminSetUsername(userId, newUsername);
    u.username = newUsername;
    toast(T("toast_username_updated"));
    openEditUserModal(userId);
    render();
  }catch(e){
    if(btn) btn.disabled = false;
    const msg = (e.message||"").toLowerCase();
    if(msg.includes("taken") || msg.includes("already") || msg.includes("exists")) toast(T("toast_username_taken"));
    else toast(T("toast_admin_username_set_failed"));
  }
}

/* Changing role/class is applied immediately (same convention as
   toggleUserActive / addTeachingAssignment / addChildLink below) rather
   than deferred to the Save Changes button, so the two never disagree
   about what's actually been saved. */
function changeUserRole(userId, newRole){
  const u = USERS[userId];
  if(!u || u.role===newRole) return;
  if(isLastAdmin(u)){ toast(T("cannot_change_role_last_admin")); openEditUserModal(userId); return; }
  releaseRoleAssignments(u);
  if(newRole!=="student") delete u.classId;
  if(newRole!=="instructor") delete u.teaching;
  if(newRole!=="parent") delete u.children;
  u.role = newRole;
  toast(T("toast_updated"));
  openEditUserModal(userId);
  render();
}

function changeUserClass(userId, classId){
  if(!classId) return;
  const u = USERS[userId];
  if(!u || u.classId===classId) return;
  if(u.classId){ const old = classById(u.classId); if(old){ const idx = old.students.indexOf(userId); if(idx!==-1) old.students.splice(idx,1); } }
  u.classId = classId;
  const cls = classById(classId);
  if(cls && !cls.students.includes(userId)) cls.students.push(userId);
  toast(T("toast_updated"));
  openEditUserModal(userId);
  render();
}

/* Deactivates the account (real logins can't be hard-deleted client-side
   without a server holding the admin API key — see the Supabase module
   above) and clears it out of *current* assignments: class roster,
   timetable slots, the teacher picker. Grades, attendance and submissions
   are left exactly as they are — deactivating someone shouldn't erase
   their academic record. Students are spliced out of their class's roster
   IN PLACE (not reassigned) so the same array shared with that class's
   Subjects — see classById(x).students — updates everywhere at once.
   Instructors are freed from every timetable period they held, and any
   Subject they owned is handed to a remaining instructor so it never
   renders with a dangling teacher. */
/* Shared by deleteUser (deactivate) and changeUserRole: releases whatever
   the account's CURRENT role holds before that role goes away — a
   student's seat in a class roster, or an instructor's timetable periods
   and any Subjects they owned (handed to a remaining instructor so
   nothing renders with a dangling teacher). Returns a note to append to
   the caller's toast when a reassignment happened. */
function releaseRoleAssignments(u){
  let note = "";
  if(u.role==="student"){
    if(u.classId){
      const cls = classById(u.classId);
      if(cls){ const idx = cls.students.indexOf(u.id); if(idx!==-1) cls.students.splice(idx,1); }
    }
  } else if(u.role==="instructor"){
    CLASSES.forEach(cls=>{
      const grid = TIMETABLE[cls.id];
      DAYS.forEach(day=>{
        PERIODS.forEach(per=>{
          const cell = grid[day.key][per.key];
          if(cell && cell.teacherId===u.id) grid[day.key][per.key] = null;
        });
      });
    });
    const remaining = teacherIds().filter(id=>id!==u.id);
    const owned = COURSES.filter(c=>c.instructor===u.id);
    if(owned.length && remaining.length){
      const fallback = remaining[0];
      owned.forEach(c=> c.instructor = fallback);
      note = T("subject_reassigned_note",{n:owned.length, name:userName(fallback)});
    }
  }
  return note;
}

function deleteUser(userId){
  const u = USERS[userId];
  if(!u) return;
  const note = releaseRoleAssignments(u);
  u.active = false;
  closeModal();
  toast(T("toast_deleted") + note);
  render();
}

/* Lets the admin declare which classes + subjects an instructor teaches,
   independent of any specific day/period. This list seeds from — and stays in
   sync with — the Timetable grid (saveTimetableCell adds to it; removing an
   assignment here clears any matching cells so the two views never disagree). */
function renderTeachingAssignmentsField(u){
  const assignments = u.teaching || [];
  return `
    <div class="field">
      <label>${T("teaching_assignments_title")}</label>
      <div class="assign-list">
        ${assignments.length ? assignments.map(a=>`
          <div class="assign-row">
            <span>${classLabel(classById(a.classId))} — ${state.lang==="ar"?a.subjectAr:a.subjectEn}</span>
            <button class="btn small danger" onclick="removeTeachingAssignment('${u.id}','${a.classId}','${escapeHtml(a.subjectEn)}')">${T("remove_assignment")}</button>
          </div>`).join("") : `<div class="empty-row" style="padding:10px;">${T("teaching_assignments_empty")}</div>`}
      </div>

function addTeachingAssignment(userId){
  const u = USERS[userId];
  const classId = document.getElementById("assign-class").value;
  const subjectEn = document.getElementById("assign-subject").value;
  const subj = SUBJECT_CATALOG.find(s=>s.en===subjectEn);
  if(!u.teaching) u.teaching = [];
  if(u.teaching.some(a=>a.classId===classId && a.subjectEn===subjectEn)){ toast(T("assignment_exists")); return; }
  u.teaching.push({classId, subjectEn: subj.en, subjectAr: subj.ar});
  toast(T("toast_assignment_added"));
  openEditUserModal(userId);
  render();
}

function removeTeachingAssignment(userId, classId, subjectEn){
  const u = USERS[userId];
  u.teaching = (u.teaching||[]).filter(a=>!(a.classId===classId && a.subjectEn===subjectEn));
  const grid = TIMETABLE[classId];
  DAYS.forEach(day=>{
    PERIODS.forEach(per=>{
      const cell = grid[day.key][per.key];
      if(cell && cell.teacherId===userId && cell.subjectEn===subjectEn){ grid[day.key][per.key] = null; }
    });
  });
  toast(T("toast_assignment_removed"));
  openEditUserModal(userId);
  render();
}

function addChildLink(userId){

function removeChildLink(userId, childId){

/* ---- SMS (simulated — this is a client-only prototype with no telecom
   gateway, so "sending" a text logs it to SMS_LOG and shows a delivery
   toast rather than dispatching a real message). Only instructors and
   parents carry a phone number, since those are the two contacts a
   school actually needs to reach outside the platform. ---- */
let SMS_LOG = [];

function renderSmsHistory(userId){
  const items = SMS_LOG.filter(s=>s.userId===userId).slice(0,5);
  if(!items.length) return "";
  return `
    <div style="margin:-4px 0 14px; padding:10px 12px; background:var(--surface-2); border-radius:10px;">
      <div style="font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:6px;">${T("sms_history_title")}</div>
      ${items.map(s=>`
        <div style="font-size:12px; padding:6px 0; border-top:1px solid var(--border);">
          <div style="color:var(--text-faint); font-size:10.5px; margin-bottom:2px;">${fmtDate(s.at)}</div>
          <div>${escapeHtml(s.message)}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function openSendSmsModal(userId){
  const u = USERS[userId];
  if(!u) return;
  const phoneEl = document.getElementById("edit-phone");
  const typedPhone = phoneEl ? phoneEl.value.trim() : "";
  const phone = typedPhone || u.phone || "";
  if(!phone){ toast(T("toast_sms_no_phone")); return; }
  if(typedPhone && typedPhone !== u.phone) u.phone = typedPhone;
  openModal(`
    <div class="modal-head"><h3>${T("send_sms_title")}</h3><button class="modal-close" onclick="openEditUserModal('${userId}')" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:14px;">${T("send_sms_to_label")}: <b>${escapeHtml(state.lang==="ar"?u.name_ar:u.name_en)}</b> — <span dir="ltr" style="unicode-bidi:embed;">${escapeHtml(phone)}</span></p>
    <div class="field">
      <label>${T("sms_message_label")}</label>
      <textarea id="sms-message" maxlength="320" placeholder="${T("sms_message_ph")}" oninput="document.getElementById('sms-char-count').textContent = this.value.length + ' / 320'"></textarea>
      <div id="sms-char-count" style="font-size:11px; color:var(--text-faint); text-align:${state.lang==="ar"?"left":"right"};">0 / 320</div>
    </div>
    ${renderSmsHistory(userId)}
    <div class="modal-actions">
      <button class="btn" onclick="openEditUserModal('${userId}')">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="sendSms('${userId}')">${T("send_sms_btn")}</button>
    </div>
  `);
}

function sendSms(userId){
  const u = USERS[userId];
  if(!u) return;
  const msgEl = document.getElementById("sms-message");
  const message = msgEl ? msgEl.value.trim() : "";
  if(!message){ toast(T("toast_sms_empty")); return; }
  SMS_LOG.unshift({id:uid("sms"), userId, phone:u.phone||"", message, at: TODAY});
  toast(T("toast_sms_sent",{phone:u.phone||""}));
  openEditUserModal(userId);
}

/* ---- SMS tied to real events (attendance / overdue work) — reuses the
   same simulated SMS_LOG as the manual "Send SMS" action above, just
   pre-filled from context so a teacher doesn't have to type it by hand. ---- */
function openNotifyAbsenceModal(studentId, courseId){
  const parents = findParentsForStudent(studentId).filter(p=>p.phone);
  if(!parents.length){ toast(T("toast_sms_no_phone")); return; }
  const c = courseById(courseId);
  const defaultMsg = T("sms_absence_default_message", {student: userName(studentId), course: c?courseTitle(c):"", date: fmtDate(state.attDate||TODAY)});
  openModal(`
    <div class="modal-head"><h3>${T("notify_absence_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:14px;">${T("send_sms_to_label")}: <b>${parents.map(p=>escapeHtml(state.lang==="ar"?p.name_ar:p.name_en)).join(", ")}</b></p>
    <div class="field">
      <label>${T("sms_message_label")}</label>
      <textarea id="sms-message" maxlength="320">${escapeHtml(defaultMsg)}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="sendParentNoticeSms('${studentId}')">${T("send_sms_btn")}</button>
    </div>

function sendParentNoticeSms(studentId){
  const msgEl = document.getElementById("sms-message");
  const message = msgEl ? msgEl.value.trim() : "";
  if(!message){ toast(T("toast_sms_empty")); return; }
  const parents = findParentsForStudent(studentId).filter(p=>p.phone);
  if(!parents.length) return;
  parents.forEach(p=>{ SMS_LOG.unshift({id:uid("sms"), userId:p.id, phone:p.phone, message, at:TODAY}); });
  toast(T("toast_sms_sent",{phone:parents.map(p=>p.phone).join(", ")}));
  closeModal();
}

function openOverdueReminderModal(studentId, courseId, assignmentId){
  const parents = findParentsForStudent(studentId).filter(p=>p.phone);
  if(!parents.length){ toast(T("toast_sms_no_phone")); return; }
  const c = courseById(courseId);
  const a = c ? c.assignments.find(x=>x.id===assignmentId) : null;

  openModal(`

    <div class="field">
      <label>${T("sms_message_label")}</label>

    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="sendParentNoticeSms('${studentId}')">${T("send_sms_btn")}</button>

function exportRosterCsv(){
  if(state.role!=="admin") return;
  const header = ["ID", "Name", "Role", "Username", "Status", "Class/Children"];
  const body = Object.values(USERS).map(u=>{
    const extra = u.role==="student" ? (classById(u.classId) ? classLabel(classById(u.classId)) : "")

  });
  downloadCsv("full-roster.csv", [header, ...body]);
}

  toast(T("toast_settings_saved"));
}

/* Saves the single term_settings row (id=1, enforced by a DB check
   constraint — see the schema) straight to Supabase, same as
   saveUserCredentials: this isn't part of the debounced local-first sync
   queue like courses/timetable, it's a rare admin action that should
   just save immediately and refresh what everyone else's next
   loadAllData() picks up. */
async function saveTermSettings(){
  const nameEn = (document.getElementById("term-name-en")?.value||"").trim();
  const nameAr = (document.getElementById("term-name-ar")?.value||"").trim();
  const startDate = document.getElementById("term-start-date")?.value||"";
  const endDate = document.getElementById("term-end-date")?.value||"";
  if(startDate && endDate && endDate < startDate){
    toast(T("toast_term_invalid_dates"));
    return;
  }
  const row = { id:1, name_en:nameEn, name_ar:nameAr, start_date: startDate||null, end_date: endDate||null };
  try{
    await sbUpsert("term_settings", row, "id");
    TERM_SETTINGS = row;
    toast(T("toast_term_saved"));
    render();
  }catch(e){
    toast(e.message || T("toast_term_invalid_dates"));
  }
}

/* ---------------------------- academic calendar ---------------------------- */
function academicEventTypeLabelKey(type){
  return {
    year_start: "academic_event_type_year_start",
    term_exam: "academic_event_type_term_exam",
    monthly_exam: "academic_event_type_monthly_exam",
  }[type] || "academic_event_type_other";
}

function openAddAcademicEventModal(){
  if(!isAdminLike(state.role)) return;
  openModal(`
    <div class="modal-head"><h3>${T("academic_event_add_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    ${academicEventFormFields()}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="saveAcademicEvent()">${T("create_btn")}</button>
    </div>
  `);
}

function openEditAcademicEventModal(eventId){
  if(!isAdminLike(state.role)) return;
  const ev = SCHOOL_EVENTS.find(e=>e.id===eventId);
  if(!ev) return;
  openModal(`
    <div class="modal-head"><h3>${T("academic_event_edit_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    ${academicEventFormFields(ev)}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="saveAcademicEvent('${eventId}')">${T("save_changes")}</button>
    </div>
  `);
}

function academicEventFormFields(ev){
  ev = ev || {type:"year_start", date:"", title_en:"", title_ar:""};
  return `
    <div class="field"><label>${T("academic_event_type_label")}</label>
      <select id="ae-type">
        ${["year_start","term_exam","monthly_exam","other"].map(t=>`<option value="${t}" ${ev.type===t?"selected":""}>${T(academicEventTypeLabelKey(t))}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>${T("academic_event_date_label")}</label><input type="date" id="ae-date" value="${ev.date||""}"/></div>
    <div class="field"><label>${T("academic_event_title_en_label")}</label><input type="text" id="ae-title-en" value="${escapeHtml(ev.title_en||"")}"/></div>
    <div class="field"><label>${T("academic_event_title_ar_label")}</label><input type="text" id="ae-title-ar" value="${escapeHtml(ev.title_ar||"")}"/></div>
  `;
}

function saveAcademicEvent(eventId){
  const type = document.getElementById("ae-type").value;
  const date = document.getElementById("ae-date").value;
  const titleEn = document.getElementById("ae-title-en").value.trim();
  const titleAr = document.getElementById("ae-title-ar").value.trim();
  if(!date || (!titleEn && !titleAr)){
    toast(state.lang==="ar"?"يرجى إدخال التاريخ والعنوان":"Please enter a date and a title.");
    return;
  }
  if(eventId){
    const ev = SCHOOL_EVENTS.find(e=>e.id===eventId);
    Object.assign(ev, {type, date, title_en:titleEn||titleAr, title_ar:titleAr||titleEn});
  }else{
    SCHOOL_EVENTS.push({id: uid("ev"), type, date, title_en:titleEn||titleAr, title_ar:titleAr||titleEn});
  }
  SCHOOL_EVENTS.sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  closeModal();
  toast(T("toast_academic_event_saved"));
  render();
}

function openDeleteAcademicEventConfirm(eventId){
  const ev = SCHOOL_EVENTS.find(e=>e.id===eventId);
  if(!ev) return;
  openModal(`
    <div class="modal-head"><h3>${T("academic_event_delete_confirm")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:18px;">${escapeHtml(state.lang==="ar"?ev.title_ar:ev.title_en)} — ${fmtDate(ev.date)}</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn danger" onclick="deleteAcademicEvent('${eventId}')">${T("delete_class_btn")}</button>
    </div>
  `);
}

function deleteAcademicEvent(eventId){
  const idx = SCHOOL_EVENTS.findIndex(e=>e.id===eventId);
  if(idx>=0) SCHOOL_EVENTS.splice(idx,1);
  closeModal();
  toast(T("toast_academic_event_deleted"));
  render();
}
