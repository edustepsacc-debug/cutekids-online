<script>
/* ---------------------------- splash intro ----------------------------
   A short branded "Welcome, {name}" animation shown right after a
   successful login (not before — at that point there's no name to
   welcome yet). Purely cosmetic/DOM-level (like the modal and tour
   overlays) — it doesn't touch `state` or persist anything, since it's
   meant to play on every login, not just a first visit. The onboarding
   tour is chained to fire once this dismisses, so the two overlays never
   fight for the screen. */
let splashActive = false;
let splashTimer = null;
function startSplash(){
  splashActive = true;
  renderSplash();
  clearTimeout(splashTimer);
  splashTimer = setTimeout(dismissSplash, 2600);
}
function renderSplash(){
  if(!splashActive) return;
  let host = document.getElementById("splash-host");
  if(!host){
    host = document.createElement("div");
    host.id = "splash-host";
    document.body.appendChild(host);
  }
  const currentUser = USERS[CURRENT_USER[state.role]];
  const currentName = currentUser ? (state.lang==="ar"?currentUser.name_ar:currentUser.name_en) : T("app_short");
  host.innerHTML = `
    <div class="splash-overlay" onclick="dismissSplash()">
      <div class="splash-inner">
        <div class="splash-glow"></div>
        <img class="splash-logo" src="${LOGO_ICON_B64}" alt="${T("app_short")}"/>
        <div class="splash-word">${T("splash_welcome",{name: currentName})}</div>
        <div class="splash-sub">${T("splash_sub")}</div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
        <div class="splash-skip">${T("splash_skip")}</div>
      </div>
    </div>
  `;
}
function dismissSplash(){
  if(!splashActive) return;
  splashActive = false;
  if(splashTimer){ clearTimeout(splashTimer); splashTimer = null; }
  const overlay = document.querySelector(".splash-overlay");
  if(overlay){
    overlay.classList.add("out");
    setTimeout(()=>{ const host = document.getElementById("splash-host"); if(host) host.remove(); maybeStartTour(); }, 550);
  } else {
    const host = document.getElementById("splash-host"); if(host) host.remove();
    maybeStartTour();
  }
}
</script>

<script>
/* ---------------------------- login ----------------------------
   A real login gate, backed by real Supabase accounts. `authed` still
   starts false on every fresh load (the session itself is restored from
   a stored refresh token, not this flag — see boot() near the bottom of
   the file), so a brand-new tab always shows the loading check before
   either the app or the login screen appears. */
let authed = false;
let loginError = null;
let loginBusy = false;

function renderLoginScreen(){
  return `
    <div class="login-screen">
      <div class="login-card">
        <img class="login-logo" src="${LOGO_ICON_B64}" alt="${T("app_short")}"/>
        <div class="login-title">${brandTitleHtml()}</div>
        <div class="login-sub">${T("login_sub")}</div>
        ${loginError ? `<p class="login-error">${escapeHtml(loginError)}</p>` : ""}
        <div class="field"><label>${T("username_label")}</label><input type="text" id="login-username" placeholder="${T("username_label")}" onkeydown="if(event.key==='Enter'){ document.getElementById('login-password').focus(); }"/></div>
        <div class="field"><label>${T("password_label")}</label><input type="password" id="login-password" placeholder="${T("password_label")}" onkeydown="if(event.key==='Enter'){ attemptLogin(); }"/></div>
        <button class="btn primary" style="width:100%;" onclick="attemptLogin()" ${loginBusy?"disabled":""}>${loginBusy ? T("login_busy") : T("login_btn")}</button>
        <button class="link-btn" style="margin-top:12px;" onclick="openForgotPasswordModal()">${T("forgot_password_link")}</button>
        <button class="lang-toggle-login" onclick="toggleLang()">${T("lang_toggle")}</button>
      </div>
    </div>
  `;
}

async function attemptLogin(){
  const usernameEl = document.getElementById("login-username");
  const passwordEl = document.getElementById("login-password");
  const username = (usernameEl ? usernameEl.value : "").trim().toLowerCase();
  const password = passwordEl ? passwordEl.value : "";
  if(!username || !password){ loginError = T("login_error_invalid"); render(); return; }
  loginBusy = true; loginError = null; render();
  try{
    const email = username + "@" + AUTH_EMAIL_DOMAIN;
    const auth = await sbSignIn(email, password);
    sbSession = { access_token: auth.access_token, refresh_token: auth.refresh_token, user: auth.user };
    const profile = await sbSelectOne("profiles", "id", auth.user.id);
    if(!profile || profile.active===false){
      await sbSignOut();
      loginBusy = false;
      loginError = T("login_error_invalid");
      render();
      return;
    }
    storeSession(sbSession);
    authed = true;
    state.role = profile.role;
    loginBusy = false;
    loginError = null;
    bootPhase = "loadingData";
    render();
    await afterLoginBoot();
    startSplash();
  }catch(e){
    sbSession = null;
    loginBusy = false;
    loginError = T("login_error_invalid");
    render();
  }
}

function logout(){
  sbSignOut();
  cloudSyncEnabled = false;
  authed = false;
  dataReady = false;
  bootPhase = "login";
  loginError = null;
  state.notifOpen = false;
  stopOnlineClassesPoll();
  closeModal();
  render();
}

/* Self-service "forgot password" would need a real mailbox for the
   confirmation link, and these accounts use a synthetic
   username@eduplus.local address rather than a real inbox — so instead
   of pretending to email a reset code, this is upfront about the one
   path that actually works right now: ask the school admin, who can
   deactivate + recreate the account with a fresh password from Users. */
function openForgotPasswordModal(){
  openModal(`
    <div class="modal-head"><h3>${T("forgot_password_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:12.5px; color:var(--text-muted); line-height:1.6;">${T("forgot_password_help")}</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">${T("close_btn")}</button></div>
  `);
}

/* Self-service password change: the one credential a logged-in user CAN
   update themselves, since it only needs their own access token (no
   service_role key required, unlike resetting someone else's password). */
let passwordChangeBusy = false;
function openChangePasswordModal(){
  passwordChangeBusy = false;
  openModal(`
    <div class="modal-head"><h3>${T("change_password_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <div class="field"><label>${T("new_password_label")}</label><input type="password" id="change-pw-1" autocomplete="new-password"/></div>
    <div class="field"><label>${T("new_password_confirm_label")}</label><input type="password" id="change-pw-2" autocomplete="new-password"/></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" id="change-pw-submit" onclick="submitPasswordChange()">${T("change_password_btn")}</button>
    </div>
  `);
}
async function submitPasswordChange(){
  if(passwordChangeBusy) return;
  const p1 = document.getElementById("change-pw-1").value;
  const p2 = document.getElementById("change-pw-2").value;
  if(p1.length<6){ toast(T("toast_password_too_short")); return; }
  if(p1!==p2){ toast(T("toast_password_mismatch")); return; }
  passwordChangeBusy = true;
  const btn = document.getElementById("change-pw-submit");
  if(btn) btn.disabled = true;
  try{
    await sbUpdateOwnPassword(p1);
    passwordChangeBusy = false;
    closeModal();
    toast(T("toast_password_changed"));
  }catch(e){
    passwordChangeBusy = false;
    if(btn) btn.disabled = false;
    toast(T("toast_password_change_failed"));
  }
}
</script>

<script>
/* ---------------------------- direct messages ----------------------------
   Simple 1:1 messaging, separate from the public per-course Discussions
   and from the simulated SMS_LOG. Threads are keyed by the sorted pair of
   user ids so there's exactly one thread per pair. Contact lists are
   scoped to sensible real-world pairs rather than the whole directory: a
   student or parent can only message their own teacher(s) plus admins; a
   teacher can message their own students, those students' parents, and
   admins; an admin can message anyone. */
let DIRECT_THREADS = {};

function dmThreadKey(a, b){ return [a, b].sort().join("__"); }
function findDmThread(a, b){ return DIRECT_THREADS[dmThreadKey(a, b)] || null; }
function findOrCreateDmThread(a, b){
  const key = dmThreadKey(a, b);
  if(!DIRECT_THREADS[key]) DIRECT_THREADS[key] = {id: key, participants: [a, b], messages: []};
  return DIRECT_THREADS[key];
}

function allowedContactsFor(role, uid){
  // Deliberately real-admin-only, not isAdminLike(): this branch returns
  // the entire user directory, which is exactly what staff must not get a
  // browsable view of. Staff falls through to the empty list below — they
  // can still reply to any thread someone else starts with them (see the
  // "|| u.role==='staff'" additions below, which make staff reachable),
  // they just can't browse the full directory to start new ones.
  if(role==="admin") return Object.values(USERS).filter(u=>u.id!==uid);

  if(role==="instructor"){
    const studentIds = new Set();
    COURSES.filter(c=>c.instructor===uid).forEach(c=>c.students.forEach(sid=>studentIds.add(sid)));
    const contacts = [];
    studentIds.forEach(sid=>{ if(USERS[sid]) contacts.push(USERS[sid]); });
    Object.values(USERS).forEach(u=>{
      if(u.role==="parent" && (u.children||[]).some(cid=>studentIds.has(cid))) contacts.push(u);
      if(isAdminLike(u.role)) contacts.push(u);
    });
    return contacts;
  }

  if(role==="student"){
    const instructorIds = new Set(COURSES.filter(c=>c.students.includes(uid)).map(c=>c.instructor));
    const contacts = [];
    instructorIds.forEach(iid=>{ if(USERS[iid]) contacts.push(USERS[iid]); });
    Object.values(USERS).forEach(u=>{ if(isAdminLike(u.role)) contacts.push(u); });
    return contacts;
  }

  if(role==="parent"){
    const u = USERS[uid];
    const childIds = (u && u.children) || [];
    const instructorIds = new Set(COURSES.filter(c=>c.students.some(sid=>childIds.includes(sid))).map(c=>c.instructor));
    const contacts = [];
    instructorIds.forEach(iid=>{ if(USERS[iid]) contacts.push(USERS[iid]); });
    Object.values(USERS).forEach(u=>{ if(isAdminLike(u.role)) contacts.push(u); });
    return contacts;
  }

  return [];
}

function myUnreadDmCount(){
  const me = CURRENT_USER[state.role];
  let n = 0;
  Object.values(DIRECT_THREADS).forEach(th=>{
    if(!th.participants.includes(me)) return;
    th.messages.forEach(m=>{ if(m.from!==me && !m.read) n++; });
  });
  return n;
}

function renderMessagesHub(){
  if(state.openThreadWith) return renderDmThread(state.openThreadWith);
  const me = CURRENT_USER[state.role];
  const contacts = allowedContactsFor(state.role, me);
  const rows = contacts.map(u=>{
    const th = findDmThread(me, u.id);
    const last = th && th.messages.length ? th.messages[th.messages.length-1] : null;
    const unread = th ? th.messages.filter(m=>m.from!==me && !m.read).length : 0;
    return {u, last, unread};
  }).sort((a, b)=>{
    if((b.unread>0) !== (a.unread>0)) return (b.unread>0) - (a.unread>0);
    if(!!b.last !== !!a.last) return (!!b.last) - (!!a.last);
    const an = state.lang==="ar" ? a.u.name_ar : a.u.name_en;
    const bn = state.lang==="ar" ? b.u.name_ar : b.u.name_en;
    return an.localeCompare(bn);
  });
  return `
    <div class="page-head"><div><h1>${T("nav_messages")}</h1><div class="sub">${T(state.role==="student"?"messages_sub_student":"messages_sub")}</div></div></div>
    <div class="list-card">
      ${rows.length ? rows.map(({u, last, unread})=>`
        <div class="list-row" style="cursor:pointer" onclick="openDmThread('${u.id}')">
          <div class="avatar">${initials(state.lang==="ar"?u.name_ar:u.name_en)}</div>
          <div class="lr-main">
            <div class="lr-title">${state.lang==="ar"?u.name_ar:u.name_en}</div>
            <div class="lr-sub">${last ? escapeHtml(last.text).slice(0,60) : T("msg_no_messages_yet")}</div>
          </div>
          ${unread ? `<span class="notif-unread-dot"></span>` : ""}
        </div>`).join("") : emptyState(ICONS.messages, T("msg_no_contacts"), "")}
    </div>
  `;
}

function openDmThread(otherId){
  const me = CURRENT_USER[state.role];
  const th = findDmThread(me, otherId);
  if(th) th.messages.forEach(m=>{ if(m.from!==me) m.read = true; });
  setState({openThreadWith: otherId});
}

function renderDmThread(otherId){
  const other = USERS[otherId];
  const me = CURRENT_USER[state.role];
  const th = findDmThread(me, otherId);
  const msgs = th ? th.messages : [];
  return `
    <button class="link-btn" style="margin-bottom:10px;" onclick="setState({openThreadWith:null})">${state.lang==="ar"?"→":"←"} ${T("back_to_messages")}</button>
    <h3 style="font-size:16px; margin-bottom:12px;">${other ? (state.lang==="ar"?other.name_ar:other.name_en) : ""}</h3>
    <div class="thread">
      ${msgs.length ? msgs.map(m=>`
        <div class="post">
          <div class="avatar">${initials(userName(m.from))}</div>
          <div class="post-body">
            <div class="post-meta"><b>${m.from===me ? T("msg_you") : userName(m.from)}</b> · ${fmtDate(m.at)}</div>
            <div class="post-text">${escapeHtml(m.text)}</div>
          </div>
        </div>`).join("") : `<div class="empty-row">${T("msg_no_messages_yet")}</div>`}
      ${state.role!=="student" ? `
      <div class="reply-box">
        <div class="avatar">${initials(userName(me))}</div>
        <textarea id="dm-text" placeholder="${T("msg_placeholder")}" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendDirectMessage('${otherId}'); }"></textarea>
        <button class="btn primary" onclick="sendDirectMessage('${otherId}')">${T("msg_send_btn")}</button>
      </div>` : `<p style="font-size:12.5px; color:var(--text-muted); margin:10px 16px 14px;">${T("messages_read_only_note")}</p>`}
    </div>
  `;
}

function sendDirectMessage(otherId){
  if(state.role==="student") return;
  const me = CURRENT_USER[state.role];
  const el = document.getElementById("dm-text");
  const text = el ? el.value.trim() : "";
  if(!text) return;
  const th = findOrCreateDmThread(me, otherId);
  th.messages.push({id: uid("dm"), from: me, text, at: TODAY, read: false});
  render();
}
</script>

<script>
/* ---------------------------- data loading & cloud sync ----------------------------
   loadAllData() populates every in-memory collection from Supabase after a
   login (real or restored from a saved session). The sync direction is the
   mirror image: render() already runs after every single mutation in this
   app — that's the existing convention everywhere — so instead of hand-
   wiring a save call into the ~30 places that touch course/session/book
   data, a debounced pass after each render() diffs the live data against
   the last snapshot pushed to Supabase and pushes only what changed
   (upserting anything different, deleting anything that disappeared). */
let bootPhase = "restoring"; // restoring | login | loadingData | ready
let dataReady = false;
let bootError = null;
let cloudSyncEnabled = false;
let cloudSyncTimer = null;
const cloudSnapshots = {
  courses: new Map(), online_classes: new Map(), library_books: new Map(),
  announcements: new Map(), timetable: new Map(), direct_threads: new Map(), profiles: new Map(),
  certificates: new Map(), school_events: new Map(), role_permissions: new Map(), it_tickets: new Map(),
};

function renderBootScreen(){
  // Logo + loading dots swap in for the old spinner + "Loading your
  // school…" text — the loading STATE is still announced to screen
  // readers (aria-live, visually hidden) even though sighted users just
  // see the animation now. Stays inside the normal themed login-card,
  // not a separate full-screen overlay.
  return `
    <div class="login-screen">
      <div class="login-card">
        <div class="boot-logo-wrap" aria-hidden="true"><img src="${LOGO_ICON_B64}" alt=""/></div>
        <div class="boot-dots" aria-hidden="true"><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span></div>
        <div class="sr-only" role="status" aria-live="polite">${bootPhase==="restoring" ? T("boot_restoring") : T("boot_loading")}</div>
        ${bootError ? `<p class="boot-error">${escapeHtml(bootError)}</p><button class="btn" style="margin-top:6px;" onclick="afterLoginBoot()">${T("retry_btn")}</button>` : ""}
      </div>
    </div>
  `;
}

async function loadAllData(){
  const [profiles, courses, onlineClasses, books, anns, timetableRows, threads, certs, termRows, events, rolePerms, tickets] = await Promise.all([
    sbSelect("profiles"), sbSelect("courses","id,data"), sbSelect("online_classes","id,data"),
    sbSelect("library_books","id,data"), sbSelect("announcements","id,data"),
    sbSelect("timetable","class_id,grid"), sbSelect("direct_threads","id,data"),
    sbSelect("certificates","id,data"),
    // Caught on its own — a site that hasn't run the term_settings
    // migration yet shouldn't lose the rest of loadAllData over it;
    // computeTermInfo() already falls back to the static term_fall text
    // when TERM_SETTINGS is null.
    sbSelect("term_settings").catch(()=>null),
    // Same reasoning: a site that hasn't run the manager_role_and_academic_
    // calendar migration yet just sees an empty Academic Calendar instead
    // of losing the rest of loadAllData.
    sbSelect("school_events","id,data").catch(()=>[]),
    // Same reasoning again: a site that hasn't run
    // supabase_migration_permissions_and_itsupport.sql yet just sees the
    // Permissions/IT Support features in their default (unconfigured)
    // state instead of losing the rest of loadAllData — null (not []) so
    // the catch is distinguishable from "table exists but is empty",
    // which is what flips FEATURE_FLAGS below.
    sbSelect("role_permissions").catch(()=>null),
    sbSelect("it_tickets","id,data").catch(()=>null),
  ]);

  Object.keys(USERS).forEach(k=>delete USERS[k]);
  (profiles||[]).forEach(p=>{
    USERS[p.id] = {
      id:p.id, role:p.role, name_en:p.name_en, name_ar:p.name_ar, username:p.username,
      active:p.active, classId:p.class_id||undefined, phone:p.phone||undefined,
      teaching:p.teaching||[], children:p.children||[],
    };
  });
  Object.keys(CURRENT_USER).forEach(k=>delete CURRENT_USER[k]);
  const me = sbSession && sbSession.user ? USERS[sbSession.user.id] : null;
  if(me) CURRENT_USER[me.role] = me.id;

  COURSES.length = 0; (courses||[]).forEach(r=> COURSES.push(r.data));
  ONLINE_CLASSES.length = 0; (onlineClasses||[]).forEach(r=> ONLINE_CLASSES.push(r.data));
  LIBRARY_BOOKS.length = 0; (books||[]).forEach(r=> LIBRARY_BOOKS.push(r.data));
  INSTITUTION_ANNOUNCEMENTS.length = 0; (anns||[]).forEach(r=> INSTITUTION_ANNOUNCEMENTS.push(r.data));
  SCHOOL_EVENTS.length = 0; (events||[]).forEach(r=> SCHOOL_EVENTS.push(r.data));
  SCHOOL_EVENTS.sort((a,b)=> (a.date||"").localeCompare(b.date||""));

  Object.keys(TIMETABLE).forEach(k=>delete TIMETABLE[k]);
  (timetableRows||[]).forEach(r=> TIMETABLE[r.class_id] = r.grid);
  CLASSES.forEach(cls=>{
    if(!TIMETABLE[cls.id]){
      const grid = {};
      DAYS.forEach(day=>{ const row={}; PERIODS.forEach(per=>{ row[per.key]=null; }); grid[day.key]=row; });
      TIMETABLE[cls.id] = grid;
    }
    cls.students = Object.values(USERS).filter(u=>u.role==="student" && u.classId===cls.id).map(u=>u.id);
  });

  Object.keys(DIRECT_THREADS).forEach(k=>delete DIRECT_THREADS[k]);
  (threads||[]).forEach(r=> DIRECT_THREADS[r.id] = r.data);

  CERTIFICATES.length = 0; (certs||[]).forEach(r=> CERTIFICATES.push(r.data));

  TERM_SETTINGS = (termRows && termRows.length) ? termRows[0] : null;

  FEATURE_FLAGS.rolePermissions = rolePerms !== null;
  ROLE_PERMISSIONS = {};
  (rolePerms||[]).forEach(r=>{ ROLE_PERMISSIONS[r.role] = r.sections||{}; });

  FEATURE_FLAGS.itTickets = tickets !== null;
  IT_TICKETS.length = 0; (tickets||[]).forEach(r=> IT_TICKETS.push(r.data));

  lastDataLoadAt = new Date();
}

function seedCloudSnapshots(){
  cloudSnapshots.courses.clear(); COURSES.forEach(c=> cloudSnapshots.courses.set(c.id, JSON.stringify(c)));
  cloudSnapshots.online_classes.clear(); ONLINE_CLASSES.forEach(s=> cloudSnapshots.online_classes.set(s.id, JSON.stringify(s)));
  cloudSnapshots.library_books.clear(); LIBRARY_BOOKS.forEach(b=> cloudSnapshots.library_books.set(b.id, JSON.stringify(b)));
  cloudSnapshots.announcements.clear(); INSTITUTION_ANNOUNCEMENTS.forEach(a=> cloudSnapshots.announcements.set(a.id, JSON.stringify(a)));
  cloudSnapshots.timetable.clear(); Object.keys(TIMETABLE).forEach(k=> cloudSnapshots.timetable.set(k, JSON.stringify(TIMETABLE[k])));
  cloudSnapshots.direct_threads.clear(); Object.keys(DIRECT_THREADS).forEach(k=> cloudSnapshots.direct_threads.set(k, JSON.stringify(DIRECT_THREADS[k])));
  cloudSnapshots.profiles.clear(); Object.keys(USERS).forEach(k=> cloudSnapshots.profiles.set(k, JSON.stringify(USERS[k])));
  cloudSnapshots.certificates.clear(); CERTIFICATES.forEach(c=> cloudSnapshots.certificates.set(c.id, JSON.stringify(c)));
  cloudSnapshots.school_events.clear(); SCHOOL_EVENTS.forEach(e=> cloudSnapshots.school_events.set(e.id, JSON.stringify(e)));
  cloudSnapshots.role_permissions.clear(); Object.keys(ROLE_PERMISSIONS).forEach(k=> cloudSnapshots.role_permissions.set(k, JSON.stringify(ROLE_PERMISSIONS[k])));
  cloudSnapshots.it_tickets.clear(); IT_TICKETS.forEach(t=> cloudSnapshots.it_tickets.set(t.id, JSON.stringify(t)));
}

/* TODAY (see its own comment) is computed once when the page loads and
   never changes on its own — a tab left open across midnight would
   otherwise keep thinking it's still yesterday until someone happens to
   refresh, which would leave today's Timetable periods never auto-created
   (see autoGenerateTodaysOnlineClasses). This just watches the real clock
   and reloads the page the moment the calendar date actually changes, so
   everything derived from TODAY catches up on its own. Runs independent
   of login state (started once from boot() below) since even the login
   screen can be left open overnight. Never reloads out from under an
   active video call — it waits until the meeting ends. */
function realCalendarDate(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
let dateRolloverHandle = null;
function startDateRolloverWatch(){
  stopDateRolloverWatch();
  dateRolloverHandle = setInterval(()=>{
    if(realCalendarDate()===TODAY) return;
    if(state.inMeeting) return; // check again next tick rather than interrupt a live class
    location.reload();
  }, 60000);
}
function stopDateRolloverWatch(){ if(dateRolloverHandle){ clearInterval(dateRolloverHandle); dateRolloverHandle=null; } }

/* The manual side of attendance: a course with no online class that day
   needs the teacher to take the roll by hand (see renderTabAttendance).
   Rather than leaving a day silently blank forever if nobody gets to it,
   the teacher gets a 2-day window from that date — once it's passed,
   anyone in the class still missing a record for that day is swept to
   "unmarked" so the gap is visible instead of invisible. Only ever
   touches the single date exactly 2 days back (not a historical
   backfill), and only ever fills in students who don't already have
   something recorded — a mark from an online-class join or an earlier
   manual save is never touched. Gated to admin/instructor since they're
   the only roles whose writes to a course actually persist (see the
   courses_write_admin_or_instructor RLS policy) — a student's own
   client would just be computing something it can't save. */
function enforceAttendanceDeadlines(){
  if(!isAdminLike(state.role) && state.role!=="instructor") return;
  const d = new Date(TODAY + "T00:00:00");
  d.setDate(d.getDate() - 2);
  const dueDate = d.toISOString().slice(0,10);
  let changed = false;
  COURSES.forEach(c=>{
    let session = c.attendance.find(s=>s.date===dueDate);
    if(!session){ session = {date: dueDate, records:{}}; c.attendance.push(session); c.attendance.sort((a,b)=>a.date.localeCompare(b.date)); }
    c.students.forEach(sid=>{
      if(!session.records[sid]){ session.records[sid] = "unmarked"; changed = true; }
    });
  });
  if(changed) scheduleCloudSync();
}

async function afterLoginBoot(){
  try{
    await loadAllData();
    seedCloudSnapshots();
    // Runs after seeding the sync snapshot (not before) so anything it
    // creates is recognized as new and actually gets pushed up on the
    // render() call right below, instead of being mistaken for data that
    // was already in sync.
    autoGenerateTodaysOnlineClasses();
    enforceAttendanceDeadlines();
    cloudSyncEnabled = true;
    dataReady = true;
    bootPhase = "ready";
    bootError = null;
    render();
    startOnlineClassesPoll();
    autoRejoinLiveClassIfTeacher();
  }catch(e){
    bootError = T("boot_load_failed");
    render();
  }
}

/* "The website tries to reload the teacher in" — if THIS teacher's own
   class is still live and already has hostJoined set (meaning they
   genuinely started it before — this isn't a student sneaking in early),
   but their own client just booted fresh with no memory of being in a
   meeting (a reload, reopening the tab, a crash), silently reconnect them
   to it instead of leaving them to notice the Join button themselves.
   Deliberately scoped to the session's own teacher ONLY — never a general
   admin — so an admin reloading their dashboard is never yanked into
   every live class school-wide; an admin who wants back in still has the
   ordinary Join button (canJoinNow already allows it). */
function autoRejoinLiveClassIfTeacher(){
  if(state.role!=="instructor" || state.inMeeting) return;
  const s = ONLINE_CLASSES.find(x=> x.status==="live" && x.hostJoined && x.teacherId===CURRENT_USER.instructor);
  if(!s) return;
  toast(T("meeting_teacher_rejoin_toast"));
  joinMeeting(s.id);
}

/* Keeps anyone just looking at the Online Classes hub (not actually in the
   call) from seeing stale status: watches every currently-live session and
   re-checks it every few seconds. This covers two cases — (1) the
   "waiting for teacher" pill (see canJoinNow) flipping to Join the moment
   staff actually opens the room, and (2) a session flipping from Live to
   Ended the moment the teacher ends it, for everyone NOT in the call (people
   actually in the meeting get faster updates from startSessionStatusPoll).
   Without this, either case would look broken — a pill or status that never
   updates on its own until a manual refresh. Cheap by design: it only makes
   requests while at least one session is live, and does nothing otherwise. */
let onlineClassesPollHandle = null;
function startOnlineClassesPoll(){
  stopOnlineClassesPoll();
  onlineClassesPollHandle = setInterval(async ()=>{
    if(!dataReady || !authed) return;
    const watched = ONLINE_CLASSES.filter(s=>s.status==="live" && s.id!==state.inMeeting);
    if(!watched.length) return;
    try{
      let changed = false;
      for(const s of watched){
        const row = await sbSelectOne("online_classes", "id", s.id);
        if(row && row.data && JSON.stringify(row.data)!==JSON.stringify(s)){ Object.assign(s, row.data); changed = true; }
      }
      if(changed) render();
    }catch(e){ /* transient network hiccup — just try again next tick */ }
  }, 8000);
}
function stopOnlineClassesPoll(){ if(onlineClassesPollHandle){ clearInterval(onlineClassesPollHandle); onlineClassesPollHandle=null; } }

function scheduleCloudSync(){
  if(!cloudSyncEnabled) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(runCloudSync, 700);
}

async function runCloudSync(){
  await syncArrayCollection("courses", COURSES, c=>c.id, c=>({ id:c.id, class_id:c.classId, instructor_id:c.instructor, students:c.students||[], data:c }));
  await syncArrayCollection("online_classes", ONLINE_CLASSES, s=>s.id, s=>({ id:s.id, class_id:s.classId, teacher_id:s.teacherId, status:s.status, data:s }));
  await syncArrayCollection("library_books", LIBRARY_BOOKS, b=>b.id, b=>({ id:b.id, data:b }));
  await syncArrayCollection("announcements", INSTITUTION_ANNOUNCEMENTS, a=>a.id, a=>({ id:a.id, data:a }));
  await syncKeyedCollection("timetable", TIMETABLE, "class_id", "grid");
  await syncDirectThreads();
  await syncProfiles();
  await syncArrayCollection("certificates", CERTIFICATES, c=>c.id, c=>({ id:c.id, student_id:c.studentId, issued_by:c.issuedBy, data:c }));
  // school_events_write_admin only allows admin/staff/manager to write —
  // skip the attempt entirely for anyone else rather than let it fail
  // silently against RLS on every sync tick.
  if(isAdminLike(state.role)){
    await syncArrayCollection("school_events", SCHOOL_EVENTS, e=>e.id, e=>({ id:e.id, data:e }));
  }
  // role_permissions/it_tickets are both admin-write-only (see the
  // migration's RLS policies) — same reasoning as school_events above,
  // and both skip entirely if the migration hasn't been run yet (see
  // FEATURE_FLAGS, set in loadAllData), so a pre-migration site never
  // spends a sync tick hammering a table that doesn't exist.
  if(state.role==="admin" && FEATURE_FLAGS.rolePermissions){
    await syncKeyedCollection("role_permissions", ROLE_PERMISSIONS, "role", "sections");
  }
  if(state.role==="admin" && FEATURE_FLAGS.itTickets){
    await syncArrayCollection("it_tickets", IT_TICKETS, t=>t.id, t=>({ id:t.id, data:t }));
  }
}

async function syncArrayCollection(table, list, idFn, rowFn){
  const snap = cloudSnapshots[table];
  const seen = new Set();
  for(const item of list){
    const id = idFn(item);
    seen.add(id);
    const json = JSON.stringify(item);
    if(snap.get(id) !== json){
      try{ await sbUpsert(table, rowFn(item)); snap.set(id, json); }
      catch(e){ console.error("sync failed:", table, id, e); }
    }
  }
  for(const id of Array.from(snap.keys())){
    if(!seen.has(id)){
      try{ await sbDelete(table, "id", id); snap.delete(id); }
      catch(e){ console.error("sync delete failed:", table, id, e); }
    }
  }
}

async function syncKeyedCollection(table, obj, idCol, dataCol){
  const snap = cloudSnapshots[table];
  const seen = new Set();
  for(const key of Object.keys(obj)){
    seen.add(key);
    const json = JSON.stringify(obj[key]);
    if(snap.get(key) !== json){
      try{ await sbUpsert(table, { [idCol]: key, [dataCol]: obj[key] }, idCol); snap.set(key, json); }
      catch(e){ console.error("sync failed:", table, key, e); }
    }
  }
  for(const key of Array.from(snap.keys())){
    if(!seen.has(key)){
      try{ await sbDelete(table, idCol, key); snap.delete(key); }
      catch(e){ console.error("sync delete failed:", table, key, e); }
    }
  }
}

async function syncDirectThreads(){
  const snap = cloudSnapshots.direct_threads;
  for(const key of Object.keys(DIRECT_THREADS)){
    const th = DIRECT_THREADS[key];
    const json = JSON.stringify(th);
    if(snap.get(key) !== json){
      try{ await sbUpsert("direct_threads", { id:key, participants: th.participants, data: th }, "id"); snap.set(key, json); }
      catch(e){ console.error("sync failed: direct_threads", key, e); }
    }
  }
}

async function syncProfiles(){
  const snap = cloudSnapshots.profiles;
  for(const id of Object.keys(USERS)){
    const u = USERS[id];
    const json = JSON.stringify(u);
    if(snap.get(id) !== json){
      try{
        await sbUpsert("profiles", {
          id: u.id, username: u.username, role: u.role, name_en: u.name_en, name_ar: u.name_ar,
          active: u.active !== false, class_id: u.classId || null, phone: u.phone || null,
          teaching: u.teaching || [], children: u.children || [],
        }, "id");
        snap.set(id, json);
      }catch(e){ console.error("sync failed: profiles", id, e); }
    }
  }
}
</script>

<script>
/* ---------------------------- init ----------------------------
   On first paint, try to restore a saved session (a page refresh or a
   new tab) before deciding whether to show the login screen — this is
   the ONLY path that restores a session without the welcome splash;
   attemptLogin() is the only place that calls startSplash(), so a
   restored session goes straight to the app the way reopening any
   real logged-in app does. */
(async function boot(){
  startDateRolloverWatch();
  const saved = loadStoredSession();
  if(saved && saved.refresh_token){
    // Paint the boot animation BEFORE the network call, not after — with
    // no render() here the page sat blank for the whole session-restore
    // check and the animation never had a chance to appear.
    render();
    try{
      const refreshed = await sbRefreshSession(saved.refresh_token);
      sbSession = { access_token:refreshed.access_token, refresh_token:refreshed.refresh_token, user:refreshed.user };
      const profile = await sbSelectOne("profiles", "id", refreshed.user.id);
      if(!profile || profile.active===false){
        await sbSignOut();
        sbSession = null;
        bootPhase = "login";
        render();
        return;
      }
      storeSession(sbSession);
      authed = true;
      state.role = profile.role;
      bootPhase = "loadingData";
      render();
      await afterLoginBoot();
      return;
    }catch(e){
      storeSession(null);
      sbSession = null;
    }
  }
  bootPhase = "login";
  authed = false;
  render();
})();

/* Soft trailing cursor glow: a small ring that eases toward the real cursor
   with a short lag, and grows a little over anything clickable — the visual
   partner to the button "light up" hover above. Skipped entirely on touch
   devices (no mouse to follow) and for anyone who prefers reduced motion
   (this is a continuous animation loop, so it's the one thing actually
   gated on that preference rather than just not using CSS @keyframes). */
function initCursorGlow(){
  if(!window.matchMedia) return;
  if(!matchMedia('(pointer:fine)').matches) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dot = document.createElement('div');
  dot.id = 'cursor-glow';
  document.body.appendChild(dot);
  let tx=0, ty=0, x=0, y=0, raf=null, shown=false;
  function loop(){
    x += (tx-x)*0.2; y += (ty-y)*0.2;
    dot.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;
    raf = requestAnimationFrame(loop);
  }
  window.addEventListener('mousemove', (e)=>{
    tx = e.clientX; ty = e.clientY;
    if(!shown){ shown = true; x = tx; y = ty; dot.classList.add('active'); loop(); }
    const onInteractive = !!(e.target.closest && e.target.closest('button, a, .btn, .nav-item, input, select, textarea, [role="button"]'));
    dot.classList.toggle('on-interactive', onInteractive);
  }, {passive:true});
  document.addEventListener('mouseleave', ()=>{ dot.classList.remove('active'); });
  document.addEventListener('mouseenter', ()=>{ if(shown) dot.classList.add('active'); });
}
initCursorGlow();

/* Soft "digital rain" background: glowing numbers (and the occasional
   hexagon) drifting down in the brand colors. Lives on its own canvas
   behind everything (#bg-rain, z-index:-1) so it never blocks clicks and
   survives every app re-render. Respects prefers-reduced-motion by
   drawing a single still frame instead of animating.

   Perf notes (this was previously laggy): shadowBlur is re-rasterized on
   every single draw call and is by far the most expensive thing a canvas
   can do per-frame — doing it per-glyph, per-trail-segment, ~every frame
   was enough to visibly stall a real page (typing, modals, everything).
   Fixed by pre-rendering each color's soft glow ONCE onto small offscreen
   sprites (that's where shadowBlur is allowed to happen) and just
   drawImage()-ing those every frame, which is cheap. Also capped column
   count, capped the devicePixelRatio, and throttled drawing to ~30fps
   instead of riding the display's full refresh rate. Guarded against ever
   running twice (defensive — would otherwise double every cost). */
function initMatrixRain(){
  if(document.getElementById('bg-rain')) return; // never double up
  const canvas = document.createElement('canvas');
  canvas.id = 'bg-rain';
  document.body.prepend(canvas);
  const ctx = canvas.getContext('2d');
  if(!ctx) return;

  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const PALETTE = ['#6366f1', '#ec5c98', '#1fb88a', '#f5a623'];
  const CHARS = '0123456789';
  const fontFamily = (getComputedStyle(document.body).getPropertyValue('--font-mono') || 'monospace').trim() || 'monospace';

  let dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let w = 0, h = 0;
  const COL_WIDTH = 40;
  const MAX_COLS = 34;
  const FRAME_MS = 1000 / 30; // throttle to ~30fps regardless of display refresh rate
  let cols = [];

  // ---- Pre-rendered glow sprites (one tiny canvas per color, built once
  // with shadowBlur so the expensive part never runs again) ----
  const GLYPH_SPRITE_SIZE = 40; // covers glyph sizes up to ~24px plus glow margin
  const HEX_SPRITE_SIZE = 56;
  const glyphSprites = {}; // color -> {canvas, ctx}
  const hexSprites = {};
  function buildGlyphSprite(color){
    const s = document.createElement('canvas');
    s.width = s.height = GLYPH_SPRITE_SIZE;
    const sctx = s.getContext('2d');
    sctx.font = `700 20px ${fontFamily}`;
    sctx.textAlign = 'center';
    sctx.textBaseline = 'middle';
    sctx.shadowColor = color;
    sctx.shadowBlur = 8;
    sctx.fillStyle = color;
    const c = GLYPH_SPRITE_SIZE / 2;
    sctx.fillText('8', c, c); // '8' as a stand-in glyph shape for the glow halo
    return s;
  }
  function buildHexSprite(color){
    const s = document.createElement('canvas');
    s.width = s.height = HEX_SPRITE_SIZE;
    const sctx = s.getContext('2d');
    const c = HEX_SPRITE_SIZE / 2, r = HEX_SPRITE_SIZE * 0.34;
    sctx.beginPath();
    for(let i = 0; i < 6; i++){
      const a = (Math.PI / 180) * (60 * i - 90);
      const px = c + r * Math.cos(a), py = c + r * Math.sin(a);
      if(i === 0) sctx.moveTo(px, py); else sctx.lineTo(px, py);
    }
    sctx.closePath();
    sctx.strokeStyle = color;
    sctx.lineWidth = 2;
    sctx.shadowColor = color;
    sctx.shadowBlur = 7;
    sctx.stroke();
    return s;
  }
  PALETTE.forEach(c => { glyphSprites[c] = buildGlyphSprite(c); hexSprites[c] = buildHexSprite(c); });

  function makeColumn(x, seedY){
    const back = Math.random() < 0.45;
    const isHex = Math.random() < 0.08;
    return {
      x,
      y: seedY !== undefined ? seedY : Math.random() * -h,
      speed: (back ? 16 : 30) + Math.random() * (back ? 10 : 18),
      size: (back ? 12 : 17) + Math.random() * (back ? 4 : 7),
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      opacity: back ? 0.16 + Math.random() * 0.12 : 0.34 + Math.random() * 0.2,
      glyph: CHARS[Math.floor(Math.random() * CHARS.length)],
      isHex,
      angle: Math.random() * Math.PI * 2,
      trail: isHex ? 1 : 4 + Math.floor(Math.random() * 2),
      gap: (back ? 30 : 24) + Math.random() * 10,
      flicker: 14 + Math.floor(Math.random() * 18),
      frame: Math.floor(Math.random() * 40),
    };
  }

  function drawColumn(col){
    if(col.isHex){
      col.angle += 0.003;
      const sprite = hexSprites[col.color];
      const size = col.size * 2.1;
      ctx.save();
      ctx.globalAlpha = col.opacity;
      ctx.translate(col.x, col.y);
      ctx.rotate(col.angle);
      ctx.drawImage(sprite, -size / 2, -size / 2, size, size);
      ctx.restore();
      return;
    }
    const sprite = glyphSprites[col.color];
    const scale = col.size / 20; // sprite glyph was drawn at 20px
    const size = GLYPH_SPRITE_SIZE * scale;
    ctx.font = `700 ${col.size}px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for(let t = 0; t < col.trail; t++){
      const ty = col.y - t * col.gap;
      if(ty < -40 || ty > h + 40) continue;
      const fade = 1 - t / col.trail;
      const a = col.opacity * fade;
      // Cheap glow: the pre-rendered blurred sprite, just stretched/placed —
      // no per-frame shadowBlur. Crisp glyph drawn on top for readability.
      ctx.globalAlpha = a;
      ctx.drawImage(sprite, col.x - size / 2, ty - size / 2, size, size);
      ctx.fillStyle = col.color;
      ctx.fillText(col.glyph, col.x, ty);
    }
    ctx.globalAlpha = 1;
  }

  function resize(){
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.min(MAX_COLS, Math.max(8, Math.ceil(w / COL_WIDTH)));
    // Seed columns spread across the whole viewport (not just above it) so
    // the rain is already visible on first paint instead of trickling in
    // from the top over several seconds.
    cols = Array.from({ length: count }, (_, i) => makeColumn(i * COL_WIDTH + COL_WIDTH / 2 + (Math.random() * 10 - 5), Math.random() * (h + 200) - 100));
  }

  let lastDraw = -Infinity; // -Infinity so the very first call always draws
  function step(ts){
    if(!reduceMotion) requestAnimationFrame(step);
    if(document.hidden) return;
    if(ts - lastDraw < FRAME_MS) return; // throttle to ~30fps
    const dt = lastDraw === -Infinity ? FRAME_MS / 1000 : (ts - lastDraw) / 1000;
    lastDraw = ts;

    ctx.clearRect(0, 0, w, h);
    for(const col of cols){
      drawColumn(col);
      col.y += col.speed * dt;
      if(!col.isHex){
        col.frame++;
        if(col.frame % col.flicker === 0 && Math.random() < 0.5){
          col.glyph = CHARS[Math.floor(Math.random() * CHARS.length)];
        }
      }
      const limit = col.isHex ? h + col.size : h + col.trail * col.gap;
      if(col.y > limit){
        const x = col.x;
        Object.assign(col, makeColumn(x));
        col.y = -Math.random() * 200;
      }
    }
  }

  window.addEventListener('resize', resize, { passive:true });
  resize();
  if(reduceMotion){ step(0); } else { requestAnimationFrame(step); }
}
initMatrixRain();

</script>
