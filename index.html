/* ---------------------------- in-platform meeting room ----------------------------
   "Join Now" drops the user into a REAL video call — actual camera/mic,
   actual peer video — hosted through Agora's RTC network. Unlike Jitsi's
   free public server, Agora never shows anyone a third-party login wall to
   become "moderator" (that was the actual dealbreaker with Jitsi: whoever's
   browser created the room first got asked to sign in with Google/GitHub
   before the class could even start). Instead, who's allowed into a given
   class's channel at all is decided server-side, once, by a Supabase Edge
   Function (agora-token) that re-checks the caller's own Supabase session
   before ever handing back a token — see that function for the exact
   rules. Once someone's authorized, they get full camera/mic — same as the
   old Jitsi room, this isn't a one-way broadcast.

   The call's DOM lives in #meet-host, a fixed-position sibling of #app
   (same dynamic-host pattern as #modal-host/#splash-host), NOT inside the
   normal render()-managed tree — render() rewrites #app's innerHTML on
   almost every state change in this app, which would tear down and
   reconnect the call constantly if it lived there. mountAgoraMeeting/
   unmountAgoraMeeting are the only things that touch #meet-host.

   There's no ready-made "drop-in UI" for a plain, build-step-free HTML
   page (Agora's own prebuilt UI kit is React-only), so the tile grid below
   is hand-built — using .meet-grid/.meet-tile/.meet-avatar/.meet-controls,
   CSS that already existed in this file from an earlier design pass and
   was just never wired up until now. */
let agoraClient = null;
let agoraLocalTracks = { audio: null, video: null };
let agoraLocalDisplayName = "";
// Guards the self-reconnect handler below (connection-state-change) against
// firing more than one overlapping recovery attempt at a time.
let agoraSelfReconnecting = false;
// Agora data-stream id used for the whiteboard's realtime messages (chat-free
// data channel, reused from the already-joined RTC client — no separate RTM
// login/token needed). Created right after join; null until then.
let agoraDataStreamId = null;

/* --------------------- live whiteboard (host draws, everyone watches) ---------------------
   Host-authoritative: only the teacher's client ever accepts pointer input
   (see wbPointerDown's amIWhiteboardHost() guard) and only the host answers
   a "reqsync" request — so a late joiner's whiteboard always converges on
   the host's, never on whatever a half-caught-up classmate happens to have.
   An "eraser" stroke isn't special server-side logic — it's just a pen
   stroke drawn in the panel's own white background color, which keeps the
   sync protocol (and replay-on-request) to one message shape: a colored
   line segment. A "text" item is the one other shape on the board — a
   single placed label rather than a point path — identified by kind:"text"
   so redraw/sync can tell the two apart; everything without a kind is
   treated as a path, so strokes from before this field existed still work. */
const WB_COLORS = ["#1f2227","#e8463a","#2f7de1","#1aa35e","#f0a93b"];
// Size presets shared by the pen, eraser and text tools, all expressed as a
// fraction of min(canvas width, canvas height) so they scale with the board.
const WB_SIZES = [
  { key:"s",  labelKey:"whiteboard_size_s",  pen:0.0018, eraser:0.016, font:0.026 },
  { key:"m",  labelKey:"whiteboard_size_m",  pen:0.0035, eraser:0.025, font:0.040 },
  { key:"l",  labelKey:"whiteboard_size_l",  pen:0.0065, eraser:0.040, font:0.060 },
  { key:"xl", labelKey:"whiteboard_size_xl", pen:0.0110, eraser:0.060, font:0.090 },
];
let wbStrokes = []; // [{id, kind:"path", color, width, points:[[xNorm,yNorm], ...]}, {id, kind:"text", color, size, x, y, text}, ...] — 0..1 normalized, device-independent
let wbColor = WB_COLORS[0];
let wbTool = "pen"; // "pen" | "eraser" | "text"
let wbSizeIndex = 1; // index into WB_SIZES — "m", matches the old fixed defaults
let wbDrawingPointerId = null;
let wbCurrentStrokeId = null;
let wbLastPoint = null;
let wbResizeBound = false;

/* --------------------- remembered camera/microphone device --------------------- */
const MEETING_DEVICE_PREFS_KEY = "eduplus_meeting_device_prefs";
function loadMeetingDevicePrefs(){
  try{ return JSON.parse(localStorage.getItem(MEETING_DEVICE_PREFS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveMeetingDevicePrefs(prefs){
  try{ localStorage.setItem(MEETING_DEVICE_PREFS_KEY, JSON.stringify(prefs)); }catch(e){}
}
// Tries the viewer's remembered device first; if it's since been
// unplugged/removed, falls back to the system default rather than failing
// the whole join over a stale preference.
async function createPreferredAudioTrack(deviceId){
  try{ return await window.AgoraRTC.createMicrophoneAudioTrack(deviceId?{microphoneId:deviceId}:undefined); }
  catch(e){ if(deviceId) return await window.AgoraRTC.createMicrophoneAudioTrack(); throw e; }
}
async function createPreferredVideoTrack(deviceId){
  try{ return await window.AgoraRTC.createCameraVideoTrack(deviceId?{cameraId:deviceId}:undefined); }
  catch(e){ if(deviceId) return await window.AgoraRTC.createCameraVideoTrack(); throw e; }
}
const AGORA_SDK_URL = "https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.8/AgoraRTC_N-production.js";
function loadAgoraScript(){
  return new Promise((resolve, reject)=>{
    if(window.AgoraRTC){ resolve(); return; }
    let script = document.getElementById("agora-rtc-sdk-script");
    if(script){ script.addEventListener("load", ()=>resolve()); script.addEventListener("error", ()=>reject(new Error("agora_script_failed"))); return; }
    script = document.createElement("script");
    script.id = "agora-rtc-sdk-script";
    script.src = AGORA_SDK_URL;
    script.onload = ()=>resolve();
    script.onerror = ()=>reject(new Error("agora_script_failed"));
    document.head.appendChild(script);
  });
}
// Kept in sync with agoraChannelName() in the agora-token Edge Function —
// both derive the same channel name purely from the session id, so
// nothing needs to coordinate it separately.
function agoraChannelName(s){
  return ("eduplus-"+s.id).replace(/[^a-zA-Z0-9_-]/g,"").slice(0,64);
}
async function fetchAgoraToken(sessionId){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/agora-token`, {
    method:"POST", headers: sbAuthHeaders(), body: JSON.stringify({ session_id: sessionId }),
  });
  const json = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(json.error || "agora_token_failed");
  return json; // {appId, channel, token}
}
// A stable, deterministic numeric id derived from a profile's uuid — Agora
// channels identify participants by a 32-bit uid, not a name or uuid, so
// every browser computes the SAME uid for the same person (pure function,
// no coordination needed) and joins the channel with it directly. This is
// also what lets any client label an incoming remote uid with a real name:
// see agoraRosterMap() below, which recomputes this same hash for every
// person who could plausibly be in the call and builds a lookup table.
function agoraUidForProfile(profileId){
  let h = 2166136261;
  for(let i=0;i<profileId.length;i++){ h ^= profileId.charCodeAt(i); h = Math.imul(h, 16777619); }
  const u = (h >>> 0) % 2147483000;
  return u === 0 ? 1 : u;
}
function agoraRosterMap(s){
  const map = {};
  const add = (userId, isHost, isHidden)=>{
    const u = USERS[userId];
    if(!u) return;
    map[agoraUidForProfile(userId)] = { name: state.lang==="ar"?u.name_ar:u.name_en, isHost: !!isHost, hidden: !!isHidden };
  };
  add(s.teacherId, true);
  const cls = classById(s.classId);
  if(cls) (cls.students||[]).forEach(sid=>add(sid, false));
  // The "admin" role joins every class invisibly — no tile, no name, no
  // audio/video reaches anyone else, not even the assigned teacher (see
  // the hidden checks in mountAgoraMeeting's user-joined/user-published
  // handlers below). Staff/manager accounts are admin-like too (whiteboard
  // draw rights, canManageSession) but stay visible like a normal host —
  // only the literal admin role is the hidden observer.
  Object.values(USERS).filter(u=>isAdminLike(u.role)).forEach(u=>add(u.id, false, u.role==="admin"));
  return map;
}
function agoraTileId(uid){ return "meet-tile-"+uid; }
function agoraTileHtml(uid, name, isMe, isHost){
  return `
    <div class="meet-tile ${isMe?"me":""}" id="${agoraTileId(uid)}">
      <div class="meet-tile-video" id="${agoraTileId(uid)}-video"><div class="meet-avatar">${initials(name)}</div></div>
      <div class="meet-tile-footer">
        <span class="meet-mic muted" id="${agoraTileId(uid)}-mic">${ICONS.micOff}</span>
        <span class="meet-name">${escapeHtml(name)}${isHost?` · ${T("meeting_host")}`:""}</span>
      </div>
    </div>`;
}
function agoraShowAvatar(uid, name){
  const el = document.getElementById(agoraTileId(uid)+"-video");
  if(el) el.innerHTML = `<div class="meet-avatar">${initials(name)}</div>`;
}
/* Marks a tile as "this person's connection dropped" instead of removing
   it outright — used for the host's tile when their Agora connection
   drops mid-class (see the user-left handler in mountAgoraMeeting), so
   students see a clear "Reconnecting…" state rather than the teacher just
   silently vanishing. Passing isReconnecting:false restores the plain
   avatar — used the moment that same uid's "user-joined" fires again. */
function agoraSetReconnecting(uid, name, isReconnecting){
  const tile = document.getElementById(agoraTileId(uid));
  if(tile) tile.classList.toggle("reconnecting", isReconnecting);
  const el = document.getElementById(agoraTileId(uid)+"-video");
  if(!el) return;
  el.innerHTML = isReconnecting
    ? `<div class="meet-avatar" style="opacity:.5;">${initials(name)}</div><div style="position:absolute; bottom:8px; left:8px; right:8px; text-align:center; font-size:11px; font-weight:600; color:#fff; background:rgba(0,0,0,.6); border-radius:6px; padding:4px 0;">${T("meeting_reconnecting_label")}</div>`
    : `<div class="meet-avatar">${initials(name)}</div>`;
}
function agoraSetMicIndicator(uid, isOn){
  const el = document.getElementById(agoraTileId(uid)+"-mic");
  if(!el) return;
  el.classList.toggle("muted", !isOn);
  el.innerHTML = isOn ? ICONS.mic : ICONS.micOff;
}
async function mountAgoraMeeting(s, tokenInfo){
  unmountAgoraMeeting();
  const host = document.createElement("div");
  host.id = "meet-host";
  document.body.appendChild(host);
  const myId = CURRENT_USER[state.role];
  const isHostMe = s.teacherId === myId;
  // Whiteboard draw rights: the assigned teacher, plus admin-like accounts
  // (admin/staff/manager) so they can demo, co-teach, or step in on any
  // class without needing to be the session's assigned teacherId. Meeting
  // host controls (End Meeting vs Leave) stay tied to isHostMe alone —
  // this only widens who may draw.
  const canDrawWhiteboard = isHostMe || isAdminLike(state.role);
  // The literal "admin" role joins invisibly: no tile of their own, no
  // camera/mic ever requested or published, and (see agoraRosterMap +
  // the user-joined/user-published/user-left handlers above) no tile is
  // created for them on anyone else's screen either — teacher included.
  // They still receive everyone else's audio/video normally (nothing here
  // restricts subscribing), and still keep full whiteboard draw rights
  // via canDrawWhiteboard above, so strokes they draw show up as normal.
  const isHiddenAdmin = state.role === "admin";
  const me = USERS[myId];
  const displayName = me ? (state.lang==="ar"?me.name_ar:me.name_en) : T("meeting_you");
  agoraLocalDisplayName = displayName;
  const myUid = agoraUidForProfile(myId);
  const roster = agoraRosterMap(s);
  host.innerHTML = `
    <div class="meet-bar">
      <div class="meet-bar-title">
        <span class="pill live"><span class="live-dot"></span>${T("status_live")}</span>
        ${isHiddenAdmin ? `<span class="pill neutral" title="${T("meeting_hidden_admin_note")}">${T("meeting_hidden_admin_pill")}</span>` : ""}
        <div>
          <div class="meet-title">${state.lang==="ar"?s.title_ar:s.title_en}</div>
          <div class="meet-sub">${classLabel(classById(s.classId))} · ${state.lang==="ar"?s.subjectAr:s.subjectEn} · <span id="meeting-elapsed">00:00</span></div>
        </div>
      </div>
    </div>
    <div class="meet-body"><div class="meet-grid${state.role==="student"?" spotlight":""}" id="agora-video-grid"></div></div>
    <div class="wb-panel" id="wb-panel" style="display:none;">
      ${canDrawWhiteboard ? `
      <div class="wb-toolbar">
        <div class="wb-swatches" id="wb-swatches">
          ${WB_COLORS.map(c=>`<button class="wb-swatch${c===wbColor?" active":""}" style="background:${c};" data-color="${c}" onclick="setWhiteboardColor('${c}')" title="${c}"></button>`).join("")}
        </div>
        <div class="wb-divider"></div>
        <div class="wb-sizes" id="wb-sizes">
          ${WB_SIZES.map((sz,i)=>`<button class="wb-size-btn${i===wbSizeIndex?" active":""}" onclick="setWhiteboardSize(${i})" title="${T(sz.labelKey)}"><span class="wb-size-dot" style="width:${6+i*4}px;height:${6+i*4}px;"></span></button>`).join("")}
        </div>
        <div class="wb-divider"></div>
        <button class="wb-tool-btn${wbTool==="pen"?" active":""}" id="wb-tool-pen" onclick="setWhiteboardTool('pen')">${ICONS.pen}<span>${T("whiteboard_tool_pen")}</span></button>
        <button class="wb-tool-btn${wbTool==="eraser"?" active":""}" id="wb-tool-eraser" onclick="setWhiteboardTool('eraser')">${ICONS.eraser}<span>${T("whiteboard_tool_eraser")}</span></button>
        <button class="wb-tool-btn${wbTool==="text"?" active":""}" id="wb-tool-text" onclick="setWhiteboardTool('text')">${ICONS.text}<span>${T("whiteboard_tool_text")}</span></button>
        <div class="wb-toolbar-spacer"></div>
        <button class="wb-tool-btn" onclick="openClearWhiteboardConfirm()">${ICONS.trash}<span>${T("whiteboard_clear_btn")}</span></button>
      </div>
      ` : `<div class="wb-readonly-note">${T("whiteboard_readonly_note")}</div>`}
      <canvas id="wb-canvas"></canvas>
    </div>
    <div class="meet-controls-dock">
      ${isHiddenAdmin ? "" : `
      <button class="meet-ctrl" id="meet-mic-btn" onclick="toggleMeetingMic()" title="${state.meetingMuted?T('meeting_unmute'):T('meeting_mute')}">
        ${state.meetingMuted?ICONS.micOff:ICONS.mic}<span>${state.meetingMuted?T("meeting_unmute"):T("meeting_mute")}</span>
      </button>
      <button class="meet-ctrl" id="meet-cam-btn" onclick="toggleMeetingCamera()" title="${state.meetingCameraOn?T('meeting_camera_off_btn'):T('meeting_camera_on_btn')}">
        ${state.meetingCameraOn?ICONS.video:ICONS.cameraOff}<span>${state.meetingCameraOn?T("meeting_camera_off_btn"):T("meeting_camera_on_btn")}</span>
      </button>
      <button class="meet-ctrl" id="meet-devices-btn" onclick="openMeetingDevicesModal()" title="${T('meeting_devices_btn')}">
        ${ICONS.settings}<span>${T("meeting_devices_btn")}</span>
      </button>
      `}
      <button class="meet-ctrl" id="meet-whiteboard-btn" onclick="toggleWhiteboard()" title="${T('meeting_whiteboard_btn')}">
        ${ICONS.pen}<span>${T("meeting_whiteboard_btn")}</span>
      </button>
      <button class="meet-ctrl leave" onclick="${isHostMe?"openEndMeetingConfirm()":"leaveMeeting()"}" title="${isHostMe?T('meeting_end_btn'):T('meeting_leave_btn')}">
        ${ICONS.hangup}<span>${isHostMe?T("meeting_end_btn"):T("meeting_leave_btn")}</span>
      </button>
    </div>
  `;
  if(!isHiddenAdmin){
    document.getElementById("meet-mic-btn").classList.toggle("active", !state.meetingMuted);
    document.getElementById("meet-cam-btn").classList.toggle("active", state.meetingCameraOn);
  }
  const grid = document.getElementById("agora-video-grid");
  if(state.role==="student"){
    grid.insertAdjacentHTML("beforeend", `<div class="meet-spotlight-placeholder" id="meet-spotlight-placeholder">${T("waiting_for_teacher")}</div>`);
  }
  // A hidden admin gets no tile of their own either — the grid shows
  // everyone else exactly as it would without them in the room.
  if(!isHiddenAdmin){
    grid.insertAdjacentHTML("beforeend", agoraTileHtml(myUid, displayName, true, isHostMe));
  }

  try{
    await loadAgoraScript();
    agoraClient = window.AgoraRTC.createClient({ mode:"rtc", codec:"vp8" });
    // Joining muted with the camera off by default (see state.meetingMuted/
    // meetingCameraOn) means a brand-new participant may have nothing
    // actually publishing yet — and Agora only fires "user-published" once
    // a track is actively enabled, not just on join. Waiting for that event
    // to create someone's tile meant a silent, camera-off student never
    // showed up in the call at all until they unmuted. "user-joined" fires
    // the moment anyone connects to the channel, published or not, so tiles
    // are created from that instead — "user-published"/"user-unpublished"
    // below now only toggle a tile's video/mic state, never its existence.
    agoraClient.on("user-joined", (user)=>{
      const info = roster[user.uid] || { name: T("meeting_host"), isHost:false };
      // A hidden admin never gets a tile for anyone, full stop — not even
      // a nameless placeholder — so their presence in the channel leaves
      // no trace in anyone else's UI, teacher included.
      if(info.hidden) return;
      // Same teacher-only rule as below: a classmate never gets a tile at
      // all in a student's spotlight view, present or not, muted or not.
      if(state.role==="student" && !info.isHost) return;
      if(!document.getElementById(agoraTileId(user.uid))){
        grid.insertAdjacentHTML("beforeend", agoraTileHtml(user.uid, info.name, false, info.isHost));
        const placeholder = document.getElementById("meet-spotlight-placeholder");
        if(placeholder) placeholder.remove();
      }else{
        // The tile already exists — this is the host's connection coming
        // BACK after a drop (see the "reconnecting" tile in user-left
        // below), not a brand-new participant. Clear that state.
        agoraSetReconnecting(user.uid, info.name, false);
      }
    });
    agoraClient.on("user-published", async (user, mediaType)=>{
      const info = roster[user.uid] || { name: T("meeting_host"), isHost:false };
      // Belt-and-suspenders: a hidden admin never actually publishes (see
      // the isHiddenAdmin branch below, which skips requesting/publishing
      // tracks entirely), but never subscribe to or surface one even if
      // something did arrive.
      if(info.hidden){
        return;
      }
      // A student's call is teacher-only, full stop: neither a classmate's
      // camera nor their microphone is ever subscribed to — only the
      // teacher's audio/video track reaches a student's browser at all
      // (bandwidth/decoding is skipped too, not just hidden with CSS).
      if(state.role==="student" && !info.isHost){
        return;
      }
      await agoraClient.subscribe(user, mediaType);
      // Belt-and-suspenders: normally already created by "user-joined"
      // above, but this covers the (harmless) case of publish arriving
      // first, or a remote user already publishing at the moment we join.
      if(!document.getElementById(agoraTileId(user.uid))){
        grid.insertAdjacentHTML("beforeend", agoraTileHtml(user.uid, info.name, false, info.isHost));
        const placeholder = document.getElementById("meet-spotlight-placeholder");
        if(placeholder) placeholder.remove();
      }
      if(mediaType==="video") user.videoTrack.play(agoraTileId(user.uid)+"-video");
      if(mediaType==="audio"){ user.audioTrack.play(); agoraSetMicIndicator(user.uid, true); }
    });
    agoraClient.on("user-unpublished", (user, mediaType)=>{
      if(mediaType==="video"){ const info = roster[user.uid]; agoraShowAvatar(user.uid, info?info.name:T("meeting_host")); }
      if(mediaType==="audio") agoraSetMicIndicator(user.uid, false);
    });
    agoraClient.on("user-left", (user)=>{
      const info = roster[user.uid];
      // The host disconnecting (a reload, a crash, a dropped connection)
      // must NOT make them vanish from the call — the class keeps running
      // (see the removed pagehide auto-end above) and the teacher is
      // expected back any moment (see autoRejoinLiveClassIfTeacher). Mark
      // their tile "reconnecting" instead of removing it; it's cleared the
      // moment their "user-joined" fires again. A classmate leaving is
      // still just removed as before — nothing to reconnect there.
      if(info && info.hidden) return;
      if(info && info.isHost){
        agoraSetReconnecting(user.uid, info.name, true);
        return;
      }
      const tile = document.getElementById(agoraTileId(user.uid));
      if(tile) tile.remove();
    });
    // Covers a drop that ISN'T a full page reload — a network blip, Agora's
    // own server hiccup, etc. "LEAVE" is this client's own intentional
    // disconnect (leaveMeeting/endMeetingForAll already tore everything
    // down by the time it fires) and is ignored; anything else gets one
    // automatic recovery attempt via a fresh joinMeeting (which itself
    // calls unmountAgoraMeeting first, so this is a clean full remount,
    // not a patch onto a half-broken connection).
    agoraClient.on("connection-state-change", (curState, _prevState, reason)=>{
      if(curState!=="DISCONNECTED" || reason==="LEAVE") return;
      if(state.inMeeting!==s.id || agoraSelfReconnecting) return;
      agoraSelfReconnecting = true;
      toast(T("meeting_self_reconnecting_toast"));
      setTimeout(()=>{
        agoraSelfReconnecting = false;
        if(state.inMeeting===s.id) joinMeeting(s.id);
      }, 2000);
    });
    agoraClient.on("stream-message", handleWhiteboardMessage);

    await agoraClient.join(tokenInfo.appId, tokenInfo.channel, tokenInfo.token, myUid);
    // Whiteboard messages ride this same already-authenticated RTC
    // connection's data channel — no separate RTM login/token. Non-fatal if
    // it fails (older Agora SDK builds, a flaky edge case): the call itself
    // still works, the whiteboard button just won't sync for this client.
    try{ agoraDataStreamId = await agoraClient.createDataStream({reliable:true, ordered:true}); }
    catch(dsErr){ console.error("Agora: whiteboard data stream unavailable —", dsErr); agoraDataStreamId = null; }

    // Camera and mic are requested independently, and each is allowed to
    // fail on its own (denied permission, no device, device in use by
    // another app, etc.) without blocking the call itself — a person with
    // no working camera should still be able to join and listen/speak,
    // and vice versa. Only a failure of loadAgoraScript/client.join above
    // (an actual connectivity/token problem) is treated as fatal below.
    // IMPORTANT: Agora refuses to publish a track that's already disabled
    // (throws TRACK_IS_DISABLED) — so tracks must be published while still
    // enabled, and only muted/turned off AFTER publish succeeds. Doing
    // setEnabled(false) before publish (the original bug here) made every
    // join fail, since the app joins muted with the camera off by default.
    // A hidden admin never requests a camera/mic track and never publishes
    // anything — there is no local media to subscribe to, which is what
    // keeps them invisible even against a client that somehow ignored the
    // "hidden" roster flag above (belt-and-suspenders, not the only guard).
    if(!isHiddenAdmin){
    const toPublish = [];
    const devicePrefs = loadMeetingDevicePrefs();
    try{
      agoraLocalTracks.audio = await createPreferredAudioTrack(devicePrefs.micId);
      toPublish.push(agoraLocalTracks.audio);
    }catch(audioErr){
      console.error("Agora: microphone unavailable —", audioErr);
      agoraLocalTracks.audio = null;
      state.meetingMuted = true;
    }
    try{
      agoraLocalTracks.video = await createPreferredVideoTrack(devicePrefs.cameraId);
      toPublish.push(agoraLocalTracks.video);
    }catch(videoErr){
      console.error("Agora: camera unavailable —", videoErr);
      agoraLocalTracks.video = null;
      state.meetingCameraOn = false;
    }
    if(toPublish.length) await agoraClient.publish(toPublish);
    if(agoraLocalTracks.audio && state.meetingMuted) await agoraLocalTracks.audio.setEnabled(false);
    if(agoraLocalTracks.video){
      if(state.meetingCameraOn) agoraLocalTracks.video.play(agoraTileId(myUid)+"-video");
      else await agoraLocalTracks.video.setEnabled(false);
    }
    agoraSetMicIndicator(myUid, !state.meetingMuted);
    }

    // Reflect any permission fallback above in the control bar itself.
    const micBtn = document.getElementById("meet-mic-btn");
    if(micBtn){
      micBtn.classList.toggle("active", !state.meetingMuted);
      micBtn.title = state.meetingMuted?T("meeting_unmute"):T("meeting_mute");
      micBtn.innerHTML = `${state.meetingMuted?ICONS.micOff:ICONS.mic}<span>${state.meetingMuted?T("meeting_unmute"):T("meeting_mute")}</span>`;
    }
    const camBtn = document.getElementById("meet-cam-btn");
    if(camBtn){
      camBtn.classList.toggle("active", state.meetingCameraOn);
      camBtn.title = state.meetingCameraOn?T("meeting_camera_off_btn"):T("meeting_camera_on_btn");
      camBtn.innerHTML = `${state.meetingCameraOn?ICONS.video:ICONS.cameraOff}<span>${state.meetingCameraOn?T("meeting_camera_off_btn"):T("meeting_camera_on_btn")}</span>`;
    }
    if(!isHiddenAdmin && !agoraLocalTracks.audio && !agoraLocalTracks.video) toast(T("meeting_media_denied_toast"));

    // Flips the flag canJoinNow() checks — see its comment above. Only
    // staff (the actual teacher or an admin) opening the room sets this,
    // so a student's Join button can never even appear before staff has
    // genuinely created the room first.
    if(canManageSession(s) && !s.hostJoined){ s.hostJoined = true; scheduleCloudSync(); }
  }catch(e){
    console.error("Agora: meeting failed to load —", e);
    toast(T("meeting_load_failed_toast"));
    leaveMeeting();
  }
}
function unmountAgoraMeeting(){
  if(agoraLocalTracks.audio){ try{ agoraLocalTracks.audio.close(); }catch(e){} agoraLocalTracks.audio = null; }
  if(agoraLocalTracks.video){ try{ agoraLocalTracks.video.close(); }catch(e){} agoraLocalTracks.video = null; }
  if(agoraClient){ try{ agoraClient.leave(); }catch(e){} agoraClient = null; }
  agoraDataStreamId = null;
  wbStrokes = [];
  wbDrawingPointerId = null;
  wbCurrentStrokeId = null;
  wbLastPoint = null;
  state.whiteboardOpen = false;
  const host = document.getElementById("meet-host");
  if(host) host.remove();
}

    btn.innerHTML = `${state.meetingMuted?ICONS.micOff:ICONS.mic}<span>${state.meetingMuted?T("meeting_unmute"):T("meeting_mute")}</span>`;
  }
}
async function toggleMeetingCamera(){
  state.meetingCameraOn = !state.meetingCameraOn;
  const myUid = agoraUidForProfile(CURRENT_USER[state.role]);
  if(agoraLocalTracks.video){
    try{ await agoraLocalTracks.video.setEnabled(state.meetingCameraOn); }catch(e){}
    if(state.meetingCameraOn) agoraLocalTracks.video.play(agoraTileId(myUid)+"-video");
    else agoraShowAvatar(myUid, agoraLocalDisplayName);
  }
  const btn = document.getElementById("meet-cam-btn");
  if(btn){
    btn.classList.toggle("active", state.meetingCameraOn);
    btn.title = state.meetingCameraOn?T("meeting_camera_off_btn"):T("meeting_camera_on_btn");
    btn.innerHTML = `${state.meetingCameraOn?ICONS.video:ICONS.cameraOff}<span>${state.meetingCameraOn?T("meeting_camera_off_btn"):T("meeting_camera_on_btn")}</span>`;
  }
}

/* --------------------- whiteboard --------------------- */
function amIWhiteboardHost(){
  const s = ONLINE_CLASSES.find(x=>x.id===state.inMeeting);
  // Mirrors canDrawWhiteboard in mountAgoraMeeting: the assigned teacher,
  // plus admin-like accounts (admin/staff/manager).
  return !!(s && (s.teacherId === CURRENT_USER[state.role] || isAdminLike(state.role)));
}
function toggleWhiteboard(){
  state.whiteboardOpen = !state.whiteboardOpen;
  const panel = document.getElementById("wb-panel");
  if(panel) panel.style.display = state.whiteboardOpen ? "flex" : "none";
  const btn = document.getElementById("meet-whiteboard-btn");
  if(btn) btn.classList.toggle("active", state.whiteboardOpen);
  if(state.whiteboardOpen){
    setupWhiteboardCanvas();
    // Bootstraps a late joiner (or anyone reopening after missing messages)
    // onto the host's current strokes. Harmless to call every time the
    // panel opens — "sync" below fully replaces this client's wbStrokes
    // rather than appending, so an extra reply is a no-op, not a duplicate.
    if(!amIWhiteboardHost()) sendWhiteboardData({ t:"reqsync" });
  }
}
/* Sizes the canvas's actual pixel buffer to match its on-screen size
   (device-pixel-ratio aware — changing canvas.width/height clears it, so
   this only touches them when they're actually out of date) and binds the
   drawing listeners once per canvas element (a fresh element every time a
   meeting is (re)mounted, so this never double-binds across meetings). */
function setupWhiteboardCanvas(){
  const canvas = document.getElementById("wb-canvas");
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if(canvas.width !== w || canvas.height !== h){
    canvas.width = w;
    canvas.height = h;
  }
  if(!canvas._wbBound){
    canvas._wbBound = true;
    canvas.addEventListener("pointerdown", wbPointerDown);
    canvas.addEventListener("pointermove", wbPointerMove);
    canvas.addEventListener("pointerup", wbPointerUp);
    canvas.addEventListener("pointerleave", wbPointerUp);
    canvas.addEventListener("pointercancel", wbPointerUp);
  }
  if(!wbResizeBound){
    wbResizeBound = true;
    window.addEventListener("resize", ()=>{ if(state.whiteboardOpen) setupWhiteboardCanvas(); });
  }
  redrawWhiteboard();
}
function wbCanvasPoint(e){
  const canvas = document.getElementById("wb-canvas");
  const rect = canvas.getBoundingClientRect();
  const x = rect.width ? (e.clientX - rect.left) / rect.width : 0;
  const y = rect.height ? (e.clientY - rect.top) / rect.height : 0;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
}
function wbPointerDown(e){
  if(!amIWhiteboardHost()) return; // read-only for everyone else, even if something bypasses the toolbar
  e.preventDefault();
  const p = wbCanvasPoint(e);
  if(wbTool==="text"){
    // A tap just places a label — no drag/stroke to track, so there's
    // nothing more to do here once the modal is open.
    openWhiteboardTextModal(p.x, p.y);
    return;
  }
  const canvas = document.getElementById("wb-canvas");
  wbDrawingPointerId = e.pointerId;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  wbLastPoint = p;
  wbCurrentStrokeId = "wb"+Date.now()+"-"+Math.floor(Math.random()*1e6);
  const color = wbTool==="eraser" ? "#ffffff" : wbColor;
  const width = wbTool==="eraser" ? WB_SIZES[wbSizeIndex].eraser : WB_SIZES[wbSizeIndex].pen;
  wbStrokes.push({ id: wbCurrentStrokeId, kind:"path", color, width, points:[[p.x,p.y]] });
  const seg = { color, width, from:[p.x,p.y], to:[p.x,p.y] }; // draws a dot for a tap-without-drag
  drawWhiteboardSegment(seg);
  sendWhiteboardData({ t:"seg", id: wbCurrentStrokeId, color, width, from: seg.from, to: seg.to });
}
function wbPointerMove(e){
  if(wbDrawingPointerId===null || e.pointerId!==wbDrawingPointerId || !wbLastPoint) return;
  const stroke = wbStrokes.find(x=>x.id===wbCurrentStrokeId);
  if(!stroke) return;
  const p = wbCanvasPoint(e);
  stroke.points.push([p.x,p.y]);
  const seg = { color: stroke.color, width: stroke.width, from:[wbLastPoint.x,wbLastPoint.y], to:[p.x,p.y] };
  drawWhiteboardSegment(seg);
  sendWhiteboardData({ t:"seg", id: stroke.id, color: stroke.color, width: stroke.width, from: seg.from, to: seg.to });
  wbLastPoint = p;
}
function wbPointerUp(e){
  if(wbDrawingPointerId!==null && e.pointerId===wbDrawingPointerId){
    const canvas = document.getElementById("wb-canvas");
    if(canvas){ try{ canvas.releasePointerCapture(e.pointerId); }catch(err){} }
  }
  wbDrawingPointerId = null;
  wbCurrentStrokeId = null;
  wbLastPoint = null;
}
function drawWhiteboardSegment(seg){
  const canvas = document.getElementById("wb-canvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  if(!w || !h) return;
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = seg.color;
  ctx.lineWidth = Math.max(1, seg.width * Math.min(w,h));
  ctx.beginPath();
  ctx.moveTo(seg.from[0]*w, seg.from[1]*h);
  ctx.lineTo(seg.to[0]*w, seg.to[1]*h);
  ctx.stroke();
  ctx.restore();
}
function drawWhiteboardText(t){
  const canvas = document.getElementById("wb-canvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  if(!w || !h) return;
  ctx.save();
  const fontPx = Math.max(10, t.size * Math.min(w,h));
  ctx.font = `600 ${fontPx}px "Segoe UI", Tahoma, Arial, sans-serif`;
  ctx.fillStyle = t.color;
  ctx.textBaseline = "top";
  ctx.fillText(t.text, t.x*w, t.y*h);
  ctx.restore();
}
function redrawWhiteboard(){
  const canvas = document.getElementById("wb-canvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  wbStrokes.forEach(stroke=>{
    if(stroke.kind==="text"){ drawWhiteboardText(stroke); return; }
    const pts = stroke.points;
    if(!pts || !pts.length) return;
    if(pts.length===1){
      drawWhiteboardSegment({ color: stroke.color, width: stroke.width, from: pts[0], to: pts[0] });
      return;
    }
    for(let i=1;i<pts.length;i++){
      drawWhiteboardSegment({ color: stroke.color, width: stroke.width, from: pts[i-1], to: pts[i] });
    }
  });
}
function sendWhiteboardData(obj){
  if(!agoraClient || agoraDataStreamId===null) return;
  try{
    agoraClient.sendStreamMessage(agoraDataStreamId, new TextEncoder().encode(JSON.stringify(obj)));
  }catch(e){ console.error("Agora: whiteboard send failed —", e); }
}
function handleWhiteboardMessage(uid, data){
  let msg;
  try{ msg = JSON.parse(new TextDecoder().decode(data)); }catch(e){ return; }
  if(!msg || typeof msg !== "object") return;
  if(msg.t === "seg"){
    let stroke = wbStrokes.find(x=>x.id===msg.id);
    if(!stroke){
      stroke = { id: msg.id, kind:"path", color: msg.color, width: msg.width, points:[msg.from] };
      wbStrokes.push(stroke);
    }
    stroke.points.push(msg.to);
    if(state.whiteboardOpen) drawWhiteboardSegment({ color: msg.color, width: msg.width, from: msg.from, to: msg.to });
  }else if(msg.t === "text"){
    if(!wbStrokes.find(x=>x.id===msg.id)){
      const t = { id: msg.id, kind:"text", color: msg.color, size: msg.size, x: msg.x, y: msg.y, text: msg.text };
      wbStrokes.push(t);
      if(state.whiteboardOpen) drawWhiteboardText(t);
    }
  }else if(msg.t === "clear"){
    wbStrokes = [];
    if(state.whiteboardOpen) redrawWhiteboard();
  }else if(msg.t === "reqsync"){
    if(amIWhiteboardHost()) sendWhiteboardData({ t:"sync", strokes: wbStrokes });
  }else if(msg.t === "sync"){
    if(!amIWhiteboardHost()){
      wbStrokes = Array.isArray(msg.strokes) ? msg.strokes : [];
      if(state.whiteboardOpen) redrawWhiteboard();
    }
  }
}
function setWhiteboardColor(c){
  wbColor = c;
  // Eraser ignores color, so picking one clearly means "draw with it" —
  // switch back to the pen. Text also uses color (for the next label), so
  // picking a color while on the text tool stays on the text tool.
  if(wbTool==="eraser") wbTool = "pen";
  document.querySelectorAll(".wb-swatch").forEach(el=>el.classList.toggle("active", el.dataset.color===c));
  setWhiteboardTool(wbTool);
}
function setWhiteboardTool(tool){
  wbTool = tool;
  const penBtn = document.getElementById("wb-tool-pen");
  const eraserBtn = document.getElementById("wb-tool-eraser");
  const textBtn = document.getElementById("wb-tool-text");
  if(penBtn) penBtn.classList.toggle("active", tool==="pen");
  if(eraserBtn) eraserBtn.classList.toggle("active", tool==="eraser");
  if(textBtn) textBtn.classList.toggle("active", tool==="text");
}
function setWhiteboardSize(i){
  if(!WB_SIZES[i]) return;
  wbSizeIndex = i;
  document.querySelectorAll(".wb-size-btn").forEach((el,idx)=>el.classList.toggle("active", idx===i));
}
/* Text is placed with a tap rather than dragged, so it gets its own small
   modal (reusing the app's existing modal system) instead of the canvas
   drawing path — the coordinates are the normalized point the host tapped,
   captured by wbPointerDown before this opens. */
function openWhiteboardTextModal(x, y){
  openModal(`
    <div class="modal-head"><h3>${T("whiteboard_text_modal_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <div class="field">
      <label>${T("whiteboard_text_label")}</label>
      <input type="text" id="wb-text-input" maxlength="200" placeholder="${T('whiteboard_text_placeholder')}"
        onkeydown="if(event.key==='Enter'){event.preventDefault(); submitWhiteboardText(${x}, ${y});}">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="submitWhiteboardText(${x}, ${y})">${T("whiteboard_text_add_btn")}</button>
    </div>
  `);
  setTimeout(()=>{ const el=document.getElementById("wb-text-input"); if(el) el.focus(); }, 30);
}
function submitWhiteboardText(x, y){
  const el = document.getElementById("wb-text-input");
  const text = el ? el.value.trim() : "";
  closeModal();
  if(!text) return;
  addWhiteboardText(x, y, text);
}
function addWhiteboardText(x, y, text){
  if(!amIWhiteboardHost()) return;
  const id = "wb"+Date.now()+"-"+Math.floor(Math.random()*1e6);
  const t = { id, kind:"text", color: wbColor, size: WB_SIZES[wbSizeIndex].font, x, y, text };
  wbStrokes.push(t);
  drawWhiteboardText(t);
  sendWhiteboardData({ t:"text", id, color: t.color, size: t.size, x, y, text });
}
function openClearWhiteboardConfirm(){
  openModal(`
    <div class="modal-head"><h3>${T("whiteboard_clear_btn")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:13.5px; color:var(--text-muted); line-height:1.6;">${T("whiteboard_clear_confirm")}</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn danger" onclick="closeModal(); clearWhiteboard();">${T("whiteboard_clear_btn")}</button>
    </div>
  `);
}
function clearWhiteboard(){
  if(!amIWhiteboardHost()) return;
  wbStrokes = [];
  redrawWhiteboard();
  sendWhiteboardData({ t:"clear" });
}

/* Reads the deviceId a live Agora local track is actually using right now
   (not just which one was originally requested), so the picker preselects
   what's really active rather than always the saved preference. */
function currentTrackDeviceId(track){
  try{
    const native = track && track.getMediaStreamTrack && track.getMediaStreamTrack();
    return (native && native.getSettings) ? (native.getSettings().deviceId || "") : "";
  }catch(e){ return ""; }
}

/* Lets a participant switch camera/microphone mid-call — e.g. a headset
   plugged in after joining, or a webcam that should replace a laptop's
   built-in one — without leaving and rejoining. Labels are only populated
   once mic/camera permission has already been granted, which is already
   true here since joining the call requested it. */
async function openMeetingDevicesModal(){
  if(!state.inMeeting){ return; }
  let cams = [], mics = [];
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    cams = devices.filter(d=>d.kind==="videoinput");
    mics = devices.filter(d=>d.kind==="audioinput");
  }catch(e){
    console.error("enumerateDevices failed —", e);
    toast(T("meeting_devices_list_failed_toast"));
    return;
  }
  const activeCam = currentTrackDeviceId(agoraLocalTracks.video);
  const activeMic = currentTrackDeviceId(agoraLocalTracks.audio);
  const prefs = loadMeetingDevicePrefs();
  const deviceOptions = (list, active, pref, fallbackLabel) => list.map((d,i)=>
    `<option value="${d.deviceId}" ${(active ? active===d.deviceId : pref===d.deviceId) ? "selected" : ""}>${escapeHtml(d.label || (fallbackLabel+" "+(i+1)))}</option>`
  ).join("");
  openModal(`
    <div class="modal-head"><h3>${T("meeting_devices_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <div class="field"><label>${T("meeting_camera_device_label")}</label>
      ${cams.length ? `<select id="meeting-camera-select">${deviceOptions(cams, activeCam, prefs.cameraId, T("meeting_camera_device_label"))}</select>` : `<div class="empty-row" style="padding:10px;">${T("meeting_no_camera_found")}</div>`}
    </div>
    <div class="field"><label>${T("meeting_mic_device_label")}</label>
      ${mics.length ? `<select id="meeting-mic-select">${deviceOptions(mics, activeMic, prefs.micId, T("meeting_mic_device_label"))}</select>` : `<div class="empty-row" style="padding:10px;">${T("meeting_no_mic_found")}</div>`}
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="applyMeetingDevices()">${T("meeting_apply_devices_btn")}</button>
    </div>
  `);
}

/* Applies the chosen camera/microphone. If a track is already live, it's
   redirected in place (AgoraRTC's setDevice) so the call keeps running on
   the same published track. If there's no live track for that kind yet
   (camera/mic failed or was never granted at join time), a fresh one is
   created for exactly the requested device and published — so switching
   devices doubles as a way to recover a camera/mic that wasn't working
   before, not just redirect one that already was. */
async function applyMeetingDevices(){
  const camSel = document.getElementById("meeting-camera-select");
  const micSel = document.getElementById("meeting-mic-select");
  const camId = camSel ? camSel.value : null;
  const micId = micSel ? micSel.value : null;
  const prefs = loadMeetingDevicePrefs();
  const myUid = agoraUidForProfile(CURRENT_USER[state.role]);
  let ok = true;
  if(camId){
    try{
      if(agoraLocalTracks.video){
        await agoraLocalTracks.video.setDevice(camId);
      }else if(agoraClient){
        agoraLocalTracks.video = await window.AgoraRTC.createCameraVideoTrack({ cameraId: camId });
        await agoraClient.publish([agoraLocalTracks.video]);
        state.meetingCameraOn = true;
        agoraLocalTracks.video.play(agoraTileId(myUid)+"-video");
        const camBtn = document.getElementById("meet-cam-btn");
        if(camBtn){
          camBtn.classList.toggle("active", true);
          camBtn.title = T("meeting_camera_off_btn");
          camBtn.innerHTML = `${ICONS.video}<span>${T("meeting_camera_off_btn")}</span>`;
        }
      }
      prefs.cameraId = camId;
    }catch(e){ console.error("camera setDevice failed —", e); ok = false; }
  }
  if(micId){
    try{
      if(agoraLocalTracks.audio){
        await agoraLocalTracks.audio.setDevice(micId);
      }else if(agoraClient){
        agoraLocalTracks.audio = await window.AgoraRTC.createMicrophoneAudioTrack({ microphoneId: micId });
        await agoraClient.publish([agoraLocalTracks.audio]);
        if(state.meetingMuted) await agoraLocalTracks.audio.setEnabled(false);
        agoraSetMicIndicator(myUid, !state.meetingMuted);
      }
      prefs.micId = micId;
    }catch(e){ console.error("microphone setDevice failed —", e); ok = false; }
  }
  saveMeetingDevicePrefs(prefs);
  closeModal();
  toast(ok ? T("meeting_devices_switched_toast") : T("meeting_device_switch_failed_toast"));
}

let meetingTimerHandle = null;
let meetingJoinedAt = null;
/* The on-screen clock now counts from the CLASS's own start time
   (s.liveStartedAt, set once in startLiveClass) rather than this one
   viewer's personal join time — a student joining a few minutes late
   should see the same elapsed time as everyone else, not their own
   private stopwatch. That shared clock is also what makes the scheduled
   duration authoritative: the moment it reaches the minutes the class was
   booked for, it ends for everyone automatically (see attemptTimeUpEnd) —
   nobody has to notice the time and remember to click End themselves. This
   check now runs on EVERY participant's own clock, not only the host's: a
   class must still end on time even if the teacher never reconnects after
   a drop (see the pagehide-listener removal and the reconnect handling
   below) — as long as at least one student is still in the room, their
   client's own tick notices time's up and asks the server to end it. */
function startMeetingTimer(sessionId){
  meetingJoinedAt = Date.now();
  stopMeetingTimer();
  meetingTimerHandle = setInterval(()=>{
    const s = sessionId ? ONLINE_CLASSES.find(x=>x.id===sessionId) : null;
    const startedAt = (s && s.liveStartedAt) ? s.liveStartedAt : meetingJoinedAt;
    const secs = Math.max(0, Math.floor((Date.now()-startedAt)/1000));
    const el = document.getElementById("meeting-elapsed");
    if(el){
      const m = Math.floor(secs/60).toString().padStart(2,"0");
      const sec = (secs%60).toString().padStart(2,"0");
      el.textContent = m+":"+sec;
    }
    if(s && s.liveStartedAt && s.duration && state.inMeeting===sessionId){
      const elapsedMin = (Date.now()-s.liveStartedAt)/60000;
      if(elapsedMin >= s.duration) attemptTimeUpEnd(sessionId);
    }
  }, 1000);
}
function stopMeetingTimer(){ if(meetingTimerHandle){ clearInterval(meetingTimerHandle); meetingTimerHandle=null; } }
/* Forced end when the scheduled duration is reached — same effect as the
   host clicking "End Meeting" (see endMeetingForAll), just triggered by
   the clock instead of a click, and with its own toast so it's clear WHY
   the class just ended. Any participant's client can call this (not just
   the teacher's), so a class on its own still ends on time even without
   the teacher present — but a plain student client can't write
   online_classes directly (see online_classes_write_admin_or_teacher), so
   the actual state change goes through a SECURITY DEFINER RPC that
   re-checks the real elapsed time against the server's own clock before
   touching anything (see end_online_class_if_time_up in the migration
   SQL) — nobody's local clock being fast/slow can end class early, and a
   dozen participants' timers all firing within the same second just means
   a dozen harmless, idempotent calls. timeUpAttempted debounces those to
   one actual network call per viewer per session. */
let timeUpAttempted = {};
async function attemptTimeUpEnd(sessionId){
  if(timeUpAttempted[sessionId]) return;
  timeUpAttempted[sessionId] = true;
  setTimeout(()=>{ delete timeUpAttempted[sessionId]; }, 15000);
  try{
    const ended = await sbRpc("end_online_class_if_time_up", { p_session_id: sessionId });
    if(ended){
      const s = ONLINE_CLASSES.find(x=>x.id===sessionId);
      if(s){ s.status = "ended"; s.hostJoined = false; }
      if(state.inMeeting===sessionId){
        state.inMeeting = null;
        stopMeetingTimer();
        stopSessionStatusPoll();
        unmountAgoraMeeting();
        render();
        toast(T("meeting_time_up_toast"));
      }
    }
  }catch(e){ console.error("end_online_class_if_time_up RPC failed —", e); }
}

/* Agora gives us no built-in way to reach into someone ELSE's browser and
   disconnect them the instant the host ends a class — there's no
   "kick everyone" command from a plain client SDK. What we DO fully
   control is our own backend, so while anyone is inside a call we just ask
   it every few seconds "is this session still live?" — the moment it
   isn't, that browser leaves on its own. This is what makes "End meeting
   for everyone" actually reach everyone. */
let sessionPollHandle = null;
function startSessionStatusPoll(sessionId){
  stopSessionStatusPoll();
  sessionPollHandle = setInterval(async ()=>{
    if(state.inMeeting !== sessionId) return;
    try{
      const row = await sbSelectOne("online_classes", "id", sessionId);
      const s = ONLINE_CLASSES.find(x=>x.id===sessionId);
      if(!row){ leaveMeeting({endedByHost:true}); return; }
      if(row.status !== "live"){
        if(s && row.data) Object.assign(s, row.data);
        leaveMeeting({endedByHost:true});
      }
    }catch(e){ /* transient network hiccup — just try again next tick */ }
  }, 6000);
}
function stopSessionStatusPoll(){ if(sessionPollHandle){ clearInterval(sessionPollHandle); sessionPollHandle=null; } }

/* Auto-attendance: the moment a student actually joins a live online
   class, they're marked present in whichever COURSES subject that
   session matches. Online classes are timetable-driven (see
   autoGenerateTodaysOnlineClasses) and intentionally decoupled from any
   specific course id, so the match is by class + subject name instead.
   If nothing matches (e.g. no course was ever set up with that exact
   subject name) this silently does nothing rather than guessing wrong.
   Never overwrites a record that's already there for that date, so it
   can't clobber something a teacher already entered by hand. */
function autoMarkPresentFromSession(sessionId, studentId){
  const s = ONLINE_CLASSES.find(x=>x.id===sessionId);
  if(!s) return;
  const norm = v => (v||"").trim().toLowerCase();
  const c = COURSES.find(cc => cc.classId===s.classId &&
    (norm(cc.title_en)===norm(s.subjectEn) || norm(cc.title_ar)===norm(s.subjectAr)));
  if(!c || !c.students.includes(studentId)) return;
  const date = s.date || TODAY;
  let session = c.attendance.find(a=>a.date===date);
  if(!session){ session = {date, records:{}, auto:{}}; c.attendance.push(session); c.attendance.sort((a,b)=>a.date.localeCompare(b.date)); }
  if(!session.records[studentId]){
    session.records[studentId] = "present";
    if(!session.auto) session.auto = {};
    session.auto[studentId] = true;
    scheduleCloudSync();
    // scheduleCloudSync() above upserts the whole course row, which a
    // student can't write directly (courses_write_admin_or_instructor).
    // This RPC is what actually saves this one student's own auto-mark —
    // it never overwrites an existing record for that date.
    sbRpc("mark_attendance_present", { p_course_id: c.id, p_date: date })
      .catch(e=> console.error("mark_attendance_present RPC failed:", e));
  }
}

async function joinMeeting(sessionId){
  const s = ONLINE_CLASSES.find(x=>x.id===sessionId);
  if(!s || s.status!=="live"){ toast(T("meeting_unavailable_toast")); return; }
  // Belt-and-suspenders: the UI never renders a Join button before this is
  // true (see canJoinNow), but this check is what actually stops the call
  // from being reachable at all for a non-staff role, not just hidden.
  if(!canJoinNow(s)){ toast(T("waiting_for_teacher")); return; }
  if(state.role==="student") autoMarkPresentFromSession(sessionId, CURRENT_USER.student);
  state.inMeeting = sessionId;
  render();
  startMeetingTimer(sessionId);
  startSessionStatusPoll(sessionId);
  try{
    const tokenInfo = await fetchAgoraToken(sessionId);
    // state.inMeeting can have been cleared (e.g. the user hit Leave)
    // while the token request was still in flight — don't mount a call
    // nobody asked for anymore.
    if(state.inMeeting===sessionId) await mountAgoraMeeting(s, tokenInfo);
  }catch(e){
    console.error("Agora: couldn't get a call token —", e);
    toast(T("meeting_load_failed_toast"));
    leaveMeeting();
  }
}
function leaveMeeting(opts){
  opts = opts || {};
  const s = ONLINE_CLASSES.find(x=>x.id===state.inMeeting);
  // If staff is the one leaving, close the join gate again — a student
  // whose Join button was already showing shouldn't be able to open a
  // room staff has actually stepped out of.
  if(s && canManageSession(s) && s.hostJoined){ s.hostJoined = false; scheduleCloudSync(); }
  state.inMeeting = null;
  stopMeetingTimer();
  stopSessionStatusPoll();
  unmountAgoraMeeting();
  render();
  toast(T(opts.endedByHost ? "meeting_ended_by_host_toast" : "meeting_left_toast"));
}
function openEndMeetingConfirm(){
  openModal(`
    <div class="modal-head"><h3>${T("meeting_end_confirm_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:13.5px; color:var(--text-muted); line-height:1.6;">${T("meeting_end_confirm_msg")}</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn danger" onclick="closeModal(); endMeetingForAll();">${T("meeting_end_btn")}</button>
    </div>
  `);
}
function endMeetingForAll(){
  const s = ONLINE_CLASSES.find(x=>x.id===state.inMeeting);
  if(s){ s.status = "ended"; s.hostJoined = false; }
  // This host's own client disconnects immediately below; everyone else's
  // browser is reached by startSessionStatusPoll noticing the status flip
  // to "ended" within a few seconds and leaving on its own — see that
  // function's comment for why polling our own backend, rather than
  // anything client-to-client, is what makes this actually reach everyone.
  state.inMeeting = null;
  stopMeetingTimer();
  stopSessionStatusPoll();
  unmountAgoraMeeting();
  render();
  toast(T("meeting_ended_toast"));
}

/* A class used to be force-ended the instant the TEACHER's tab closed or
   reloaded (a `pagehide` listener PATCHed online_classes straight to
   "ended" on the way out). Deliberately removed: a reload, a crash, or a
   flaky connection should never kill a live class out from under every
   student still in it. The class now only ever ends two ways — the
   teacher explicitly clicking "End Meeting" (endMeetingForAll) or the
   scheduled duration running out (attemptTimeUpEnd, checked by every
   participant's own clock, teacher or not). If the teacher's tab goes
   away mid-class, the room simply keeps running: students stay in,
   see the teacher's tile marked "reconnecting" (see the user-left handler
   in mountAgoraMeeting), and the teacher is silently rejoined to it
   automatically the next time their own client boots back up (see
   autoRejoinLiveClassIfTeacher, called from afterLoginBoot). */

</script>

<script>
/* ---------------------------- digital library ----------------------------
   Books are decoupled from Subjects (see the LIBRARY_BOOKS comment above) —
   every class, including ones with no Subject page, can hold books. Admin
   manages the catalog; every role can browse and open. A book's `fileUrl` is
   a blob: URL from URL.createObjectURL on an admin-uploaded PDF — it only
   lives for this browser tab/session since there's no file server here. */
function renderLibraryPage(){
  return `
    <div class="page-head">
      <div><h1>${T("nav_library")}</h1><div class="sub">${T("library_page_sub")}</div></div>
    </div>
    ${emptyState(ICONS.library, T("library_coming_soon"), "")}
  `;
}

function bookCard(book){
  const cls = classById(book.classId);
  return `
  <div class="course-card">
    <div class="cc-body">
      <div class="cc-code" style="display:flex; align-items:center; justify-content:space-between;">
        <span>${classLabel(cls)}</span>
        ${book.fileUrl ? "" : `<span class="pill neutral">${T("no_file_attached")}</span>`}
      </div>
      <div class="cc-title">${state.lang==="ar"?book.title_ar:book.title_en}</div>
    </div>
    <div class="cc-actions">
      <button class="cc-open" ${book.fileUrl?"":"disabled"} onclick="openBook('${book.id}')">${ICONS.file}${T("open_book_btn")}</button>
      ${isAdminLike(state.role) ? `<button class="cc-open" onclick="openManageBookModal('${book.id}')">${ICONS.settings}${T("manage_book_btn")}</button>` : ""}
    </div>
  </div>`;
}

function openBook(bookId){
  const book = LIBRARY_BOOKS.find(b=>b.id===bookId);
  if(!book || !book.fileUrl){ toast(T("no_pdf_note")); return; }
  window.open(book.fileUrl, "_blank");
}

function openAddBookModal(){
  openModal(`
    <div class="modal-head"><h3>${T("add_book_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <div class="field"><label>${T("book_title_label")}</label><input type="text" id="new-book-title" placeholder="${T("book_title_label")}"/></div>
    <div class="field"><label>${T("select_class_label")}</label>
      <select id="new-book-class">${classOptionsGrouped()}</select>
    </div>
    <div class="field"><label>${T("book_file_label")}</label>
      <input type="file" id="new-book-file" accept="application/pdf"/>
      <div style="font-size:11px; color:var(--text-faint); margin-top:5px;">${T("book_file_optional_note")}</div>
    </div>
    <div style="font-size:11px; color:var(--text-faint); margin-bottom:12px;">${T("pdf_session_note")}</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
      <button class="btn primary" onclick="createBook()">${T("create_btn")}</button>
    </div>
  `);
}

function createBook(){
  const title = document.getElementById("new-book-title").value.trim();
  const classId = document.getElementById("new-book-class").value;
  if(!title || !classId){ toast(T("book_title_required")); return; }
  const fileInput = document.getElementById("new-book-file");
  const file = fileInput && fileInput.files[0];
  const book = {
    id: uid("lb"), title_en:title, title_ar:title, classId,
    fileName: file ? file.name : null,
    fileUrl: file ? URL.createObjectURL(file) : null,
    addedAt: TODAY,
  };
  LIBRARY_BOOKS.push(book);
  closeModal();
  toast(T("toast_book_added"));
  render();
}

function openManageBookModal(bookId){
  const book = LIBRARY_BOOKS.find(b=>b.id===bookId);
  if(!book) return;
  openModal(`
    <div class="modal-head"><h3>${state.lang==="ar"?book.title_ar:book.title_en}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <div class="field"><label>${T("book_title_label")}</label><input type="text" id="edit-book-title" value="${escapeHtml(state.lang==="ar"?book.title_ar:book.title_en)}"/></div>
    <div class="field"><label>${T("select_class_label")}</label>
      <select id="edit-book-class">${classOptionsGrouped(book.classId)}</select>
    </div>
    <div class="field"><label>${T("replace_file_label")}</label>
      <input type="file" id="edit-book-file" accept="application/pdf"/>
      <div style="font-size:11px; color:var(--text-faint); margin-top:5px;">${book.fileName ? escapeHtml(book.fileName) : T("no_file_attached")}</div>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="link-btn" style="color:var(--critical);" onclick="openDeleteBookConfirm('${book.id}')">${T("delete_book_btn")}</button>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="closeModal()">${T("cancel_btn")}</button>
        <button class="btn primary" onclick="saveBookDetails('${book.id}')">${T("save_changes")}</button>
      </div>
    </div>
  `);
}

function saveBookDetails(bookId){
  const book = LIBRARY_BOOKS.find(b=>b.id===bookId);
  const title = document.getElementById("edit-book-title").value.trim();
  const classId = document.getElementById("edit-book-class").value;
  if(!title || !classId){ toast(T("book_title_required")); return; }
  book.title_en = title; book.title_ar = title; book.classId = classId;
  const fileInput = document.getElementById("edit-book-file");
  const file = fileInput && fileInput.files[0];
  if(file){
    if(book.fileUrl){ try{ URL.revokeObjectURL(book.fileUrl); }catch(e){} }
    book.fileUrl = URL.createObjectURL(file);
    book.fileName = file.name;
  }
  closeModal();
  toast(T("toast_book_updated"));
  render();
}

function openDeleteBookConfirm(bookId){
  const book = LIBRARY_BOOKS.find(b=>b.id===bookId);
  openModal(`
    <div class="modal-head"><h3>${T("delete_book_confirm_title")}</h3><button class="modal-close" onclick="closeModal()" aria-label="${T('close_btn')}">×</button></div>
    <p style="font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:18px;">${T("delete_book_confirm_msg",{title: state.lang==="ar"?book.title_ar:book.title_en})}</p>
    <div class="modal-actions">
      <button class="btn" onclick="openManageBookModal('${bookId}')">${T("cancel_btn")}</button>
      <button class="btn danger" onclick="deleteBook('${bookId}')">${T("delete_book_btn")}</button>
    </div>
  `);
}

function deleteBook(bookId){
  const book = LIBRARY_BOOKS.find(b=>b.id===bookId);
  if(book && book.fileUrl){ try{ URL.revokeObjectURL(book.fileUrl); }catch(e){} }
  const idx = LIBRARY_BOOKS.findIndex(b=>b.id===bookId);
  if(idx!==-1) LIBRARY_BOOKS.splice(idx,1);
  closeModal();
  toast(T("toast_book_deleted"));
  render();
}
</script>

<script>
/* ---------------------------- assignments tab ---------------------------- */
function renderTabAssignments(c){
  if(state.role==="student" || state.role==="parent"){
    const sid = activeStudentId();
    const canSubmit = state.role==="student";
    return `<div class="list-card">
      ${c.assignments.map(a=>{
        if((a.type||"legacy")==="quiz"){
          const attempts = homeworkQuizAttemptsFor(a, sid);
          const sub = a.submissions[sid];
          const status = sub ? "graded" : (isPastDeadline(a.due) ? "closed" : "not_submitted");
          const canTake = canSubmit && !isPastDeadline(a.due) && attempts.length < QUIZ_MAX_ATTEMPTS;
          const showBtn = canTake || sub;
          return `<div class="list-row">
            <div class="lr-icon">${ICONS.reports}</div>
            <div class="lr-main">
              <div class="lr-title">${state.lang==="ar"?a.title_ar:a.title_en}</div>
              <div class="lr-sub">${T("due_label")} ${fmtDate(a.due)}${sub?` · <span class="grade-fig">${sub.grade}/${sub.total}</span>`:""}</div>
            </div>
            ${statusPill(status)}
            ${showBtn ? `<button class="btn small" onclick="${sub ? `viewHomeworkQuizResult('${c.id}','${a.id}')` : `openHomeworkQuizModal('${c.id}','${a.id}')`}">${sub?T("view_submission"):T("submit_assignment")}</button>` : ""}
          </div>`;
        }
        const status = subStatus(a, sid);
        const sub = a.submissions[sid];
        const showBtn = (canSubmit && status!=="closed") || sub;
        return `<div class="list-row">
          <div class="lr-icon">${ICONS.file}</div>
          <div class="lr-main">
            <div class="lr-title">${state.lang==="ar"?a.title_ar:a.title_en}</div>
            <div class="lr-sub">${T("due_label")} ${fmtDate(a.due)} · ${a.points} ${T("points_label")}${sub&&sub.grade!=null?` · <span class="grade-fig">${sub.grade}/${a.points}</span>`:""}</div>
          </div>
          ${statusPill(status)}
          ${showBtn ? `<button class="btn small" onclick="openAssignmentModal('${c.id}','${a.id}')">${sub?T("view_submission"):T("submit_assignment")}</button>` : ""}
        </div>`;
      }).join("") || `<div class="empty-row">${T("no_results")}</div>`}
    </div>`;
  }
  // instructor / admin view
  return `<div class="section-head" style="margin-bottom:2px;"><span></span><button class="btn primary small" onclick="openAddAssignmentModal('${c.id}')">${ICONS.file}${T("add_homework_btn")}</button></div>
  <div class="list-card">
    ${c.assignments.map(a=>{
      if((a.type||"legacy")==="quiz"){
        const subCount = Object.keys(a.submissions).length;
        return `<div class="list-row" style="cursor:pointer" onclick="openManageHomeworkQuizModal('${c.id}','${a.id}')">
          <div class="lr-icon">${ICONS.reports}</div>
          <div class="lr-main">
            <div class="lr-title">${state.lang==="ar"?a.title_ar:a.title_en}</div>
            <div class="lr-sub">${T("due_label")} ${fmtDate(a.due)} · ${T("assignment_type_quiz")}</div>
          </div>
          <span class="pill good">${subCount}/${c.students.length} ${T("attempted")}</span>
        </div>`;
      }
      const subCount = Object.keys(a.submissions).length;
      const gradedCount = Object.values(a.submissions).filter(s=>s.grade!=null).length;
      return `<div class="list-row" style="cursor:pointer" onclick="openAssignmentRoster('${c.id}','${a.id}')">
        <div class="lr-icon">${ICONS.file}</div>
        <div class="lr-main">
          <div class="lr-title">${state.lang==="ar"?a.title_ar:a.title_en}</div>
          <div class="lr-sub">${T("due_label")} ${fmtDate(a.due)} · ${a.points} ${T("points_label")}</div>
        </div>
        <span class="pill ${gradedCount<subCount?"warning":"good"}">${gradedCount}/${subCount} ${state.lang==="ar"?"مُصحح":"graded"}</span>
      </div>`;
    }).join("") || `<div class="empty-row">${T("no_results")}</div>`}
  </div>`;
}

/* Auto-posts a bilingual course announcement (same shape postAnnouncement
   writes by hand) so a class finds out about new homework/quizzes without
   the teacher having to remember to announce it separately. titleKey/bodyKey
   are I18N keys; vars fills in their {placeholders} in both languages. */
function postAutoAnnouncement(courseId, titleKey, bodyKey, vars){
  const c = courseById(courseId);
  if(!c) return;
  c.announcements.unshift({
    id: uid("an"),
    title_en: Tlang(titleKey, "en", vars), title_ar: Tlang(titleKey, "ar", vars),
    body_en: Tlang(bodyKey, "en", vars), body_ar: Tlang(bodyKey, "ar", vars),
    date: TODAY,
  });
}

/* Mirrors openAddQuizModal/createQuiz — a homework starts with just a title,
   due date, and point value; the roster (openAssignmentRoster) is where
   submissions get graded once students turn work in. */
function openAddAssignmentModal(courseId){
  openModal(`

function createAssignment(courseId){

  const due = document.getElementById("new-assignment-due").value;
  const typeSel = document.getElementById("new-assignment-type");
  const type = typeSel ? typeSel.value : "legacy";
  if(type==="quiz"){
    if(!title || !due){ toast(T("assignment_fields_required")); return; }
    const a = { id: uid("a"), title_en:title, title_ar:title, due, type:"quiz", points:0, questions:[], submissions:{}, scoringPolicy:"last", createdAt: Date.now(), announced:false };
    c.assignments.push(a);
    toast(T("toast_assignment_created"));
    openManageHomeworkQuizModal(courseId, a.id);
    return;
  }
  const points = parseInt(document.getElementById("new-assignment-points").value, 10);
  if(!title || !due || !points || points<1){ toast(T("assignment_fields_required")); return; }
  c.assignments.push({ id: uid("a"), title_en:title, title_ar:title, due, type, points, submissions:{}, createdAt: Date.now() });

  toast(T("toast_assignment_created"));

function submitAssignment(courseId, assignmentId){
  const c = courseById(courseId), a = c.assignments.find(x=>x.id===assignmentId);
  if(isPastDeadline(a.due)){ closeModal(); toast(T("assignment_deadline_passed")); return; }
  const type = a.type || "legacy";
  const text = document.getElementById("submission-text").value.trim();
  const fileInput = document.getElementById("submission-file");
  const file = fileInput && fileInput.files[0];
  if(type==="text" && !text){ toast(T("submission_text_required")); return; }
  if(type==="file" && !file){ toast(T("submission_file_required")); return; }
  if(type==="legacy" && !text && !file){ toast(state.lang==="ar"?"يرجى كتابة إجابة أو إرفاق ملف قبل التسليم":"Please write a response or attach a file before submitting."); return; }
  const sid = CURRENT_USER.student;
  const prev = a.submissions[sid];
  if(prev && prev.fileUrl){ try{ URL.revokeObjectURL(prev.fileUrl); }catch(e){} }
  a.submissions[sid] = {
    text,
    fileName: file ? file.name : null,
    fileUrl: file ? URL.createObjectURL(file) : null,
    at: TODAY, grade:null, feedback:null
  };
  closeModal();
  toast(T("toast_submitted"));
  render();
  // The generic cloud sync (scheduleCloudSync, triggered by render() above)
  // upserts the whole course row, which courses_write_admin_or_instructor
  // silently rejects for a student. This RPC is what actually gets THIS
  // student's own submission saved — it only ever touches their own slot.
  sbRpc("submit_homework", {
    p_course_id: courseId, p_assignment_id: assignmentId,
    p_submission: { text: a.submissions[sid].text, fileName: a.submissions[sid].fileName, at: a.submissions[sid].at, grade:null, feedback:null }
  }).catch(e=> console.error("submit_homework RPC failed:", e));
}

/* ---------------------------- grade/attendance trend ----------------------------
   A small single-series line for "is this improving or slipping" at a glance —
   one hue (the app accent), thin 2px stroke, rounded caps, a light dashed
   0/50/100 grid, and only the current value labeled directly (no legend needed
   for a single series). Native <title> tooltips on each point keep it simple
   while still surfacing the exact figure on hover. */
function sparklineSvg(points, opts){
  opts = opts || {};
  const w = opts.width || 560, h = opts.height || 120, pad = 22;
  if(!points.length) return `<div class="empty-row" style="padding:16px;">${T("no_results")}</div>`;
  const innerW = w - pad*2, innerH = h - pad*2;
  const n = points.length;
  const stepX = n>1 ? innerW/(n-1) : 0;
  const coords = points.map((p,i)=>({
    x: pad + (n>1 ? i*stepX : innerW/2),
    y: pad + innerH - (Math.max(0,Math.min(100,p.value))/100)*innerH,
    v: p.value, label: p.label
  }));
  const linePath = coords.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const gridYs = [0,50,100].map(v=> pad + innerH - (v/100)*innerH);
  const last = coords[coords.length-1];
  const labelEnd = last.x > w-70;
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:${h}px; overflow:visible;" role="img" aria-label="${escapeHtml(opts.ariaLabel||"")}">
    ${gridYs.map(y=>`<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-pad}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>`).join("")}
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.slice(0,-1).map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>${escapeHtml(p.label)}: ${Math.round(p.v)}%</title></circle>`).join("")}
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${escapeHtml(last.label)}: ${Math.round(last.v)}%</title></circle>
    <text x="${(labelEnd?last.x-9:last.x).toFixed(1)}" y="${Math.max(12,last.y-10).toFixed(1)}" font-size="11" font-weight="700" fill="var(--text)" text-anchor="${labelEnd?"end":"middle"}">${Math.round(last.v)}%</text>
  </svg>`;
}

function renderGradeTrendChart(c, sid){
  const items = [
    ...c.assignments.map(a=>({date:a.due, label: state.lang==="ar"?a.title_ar:a.title_en, sub:a.submissions[sid], points:a.points, kind:"a"})),
    ...c.quizzes.map(q=>({date:q.due, label: state.lang==="ar"?q.title_ar:q.title_en, sub:q.results[sid], points:null, kind:"q"})),
  ].filter(it=> it.sub && (it.kind==="a" ? it.sub.grade!=null : it.sub.score!=null))
   .sort((a,b)=> String(a.date).localeCompare(String(b.date)));
  const gradePoints = items.map(it=>{
    const val = it.kind==="a" ? (it.sub.grade/it.points)*100 : (it.sub.score/it.sub.total)*100;
    return {label: it.label, value: val};
  });
  const attRecords = (c.attendance||[]).filter(s=>s.records[sid] && s.records[sid]!=="unmarked").sort((a,b)=>a.date.localeCompare(b.date));
  let presentSoFar = 0;
  const attPoints = attRecords.map((s,i)=>{
    if(s.records[sid]==="present" || s.records[sid]==="late") presentSoFar++;
    return {label: fmtDate(s.date), value: (presentSoFar/(i+1))*100};
  });
  const gradeCard = gradePoints.length>=2 ? `<div class="chart-card"><h3>${T("grade_trend_title")}</h3><div class="chart-sub">${T("grade_trend_sub")}</div>${sparklineSvg(gradePoints,{ariaLabel:T("grade_trend_title")})}</div>` : "";
  const attCard = attPoints.length>=2 ? `<div class="chart-card"><h3>${T("attendance_trend_title")}</h3><div class="chart-sub">${T("attendance_trend_sub")}</div>${sparklineSvg(attPoints,{ariaLabel:T("attendance_trend_title")})}</div>` : "";
  if(!gradeCard && !attCard) return "";
  if(gradeCard && attCard) return `<div class="grid-2" style="margin-bottom:16px;">${gradeCard}${attCard}</div>`;
  return `<div style="margin-bottom:16px;">${gradeCard || attCard}</div>`;
}

function renderTabGradebook(c){
  const buckets = {low:0, mid:0, high:0};
  let counted = 0;
  c.assignments.forEach(a=> Object.values(a.submissions).forEach(s=>{
    if(s.grade==null) return;
    const pct = (s.grade/a.points)*100; counted++;
    if(pct < 60) buckets.low++; else if(pct < 80) buckets.mid++; else buckets.high++;
  }));
  const max = Math.max(1, buckets.low, buckets.mid, buckets.high);
  const rows = c.students.map(sid=>{
    const cells = c.assignments.map(a=>{ const s=a.submissions[sid]; return s&&s.grade!=null ? s.grade+"/"+a.points : "—"; });
    const overall = weightedOverall(c, sid);
    const certBtn = `<button class="link-btn" onclick="openStudentCertificate('${sid}')">${T("cert_view_link")}</button>`;
    return `<tr><td>${userName(sid)}</td>${cells.map(v=>`<td class="grade-fig">${v}</td>`).join("")}<td class="grade-fig"><b>${overall!=null?Math.round(overall)+"%":"—"}</b></td><td>${certBtn}</td></tr>`;
  }).join("");
  return `
    <div class="grid-2">
      <div class="chart-card">
        <h3>${T("grade_dist_chart")}</h3><div class="chart-sub">${T("grade_dist_sub")}</div>
        ${counted ? ["low","mid","high"].map(k=>`
          <div class="bar-row">
            <div class="bl">${T(k)}</div>
            <div class="bar-track"><div class="bar-fill" data-tip="${buckets[k]}" style="width:${(buckets[k]/max)*100}%; background:${k==="low"?"var(--critical)":k==="mid"?"var(--warning)":"var(--good)"}"></div></div>
            <div class="bar-val">${buckets[k]}</div>
          </div>`).join("") : `<div class="empty-row">${T("no_results")}</div>`}
      </div>
      <div class="stat-tile" style="justify-content:center;">
        <div class="label">${T("stat_avg_class")}</div>
        <div class="value">${(()=>{ let sum=0,n=0; c.students.forEach(sid=>{ const v=weightedOverall(c,sid); if(v!=null){sum+=v;n++;} }); return n?Math.round(sum/n)+"<small>%</small>":"—"; })()}</div>
      </div>
    </div>
    <div class="chart-card" style="margin-bottom:16px;">
      <h3>${T("grade_weights_title")}</h3>
      <div class="chart-sub">${T("grade_weights_sub")}</div>
      <div style="display:flex; gap:14px; align-items:flex-end; margin-top:12px; flex-wrap:wrap;">
        <div class="field" style="margin-bottom:0;"><label>${T("tab_assignments")} %</label><input type="number" id="weight-assignments" min="0" max="100" value="${courseWeights(c).assignments}" style="width:90px;"/></div>
        <div class="field" style="margin-bottom:0;"><label>${T("tab_quizzes")} %</label><input type="number" id="weight-quizzes" min="0" max="100" value="${courseWeights(c).quizzes}" style="width:90px;"/></div>
        <button class="btn primary" onclick="setGradeWeights('${c.id}')">${T("save_changes")}</button>
      </div>
    </div>
    <div class="section-head" style="margin-bottom:2px;">
      <span></span>
      <button class="btn small" onclick="exportGradebookCsv('${c.id}')">${ICONS.file}${T("export_csv_btn")}</button>
    </div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>${T("name_label")}</th>${c.assignments.map(a=>`<th>${state.lang==="ar"?a.title_ar:a.title_en}</th>`).join("")}<th>${T("stat_overall_grade")}</th><th>${T("cert_col_action")}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  `;
}

function exportGradebookCsv(courseId){
  const c = courseById(courseId);
  if(!c) return;
  const header = ["Student", ...c.assignments.map(a=>a.title_en), "Overall %"];
  const body = c.students.map(sid=>{
    const cells = c.assignments.map(a=>{ const s=a.submissions[sid]; return s&&s.grade!=null ? s.grade+"/"+a.points : ""; });
    const overall = weightedOverall(c, sid);
    return [userName(sid), ...cells, overall!=null?Math.round(overall):""];
  });
  downloadCsv(`gradebook-${c.code}.csv`, [header, ...body]);
}

function setGradeWeights(courseId){
  const c = courseById(courseId);
  if(!c) return;
  const aw = parseInt(document.getElementById("weight-assignments").value, 10);
  const qw = parseInt(document.getElementById("weight-quizzes").value, 10);
  if(isNaN(aw) || isNaN(qw) || aw<0 || qw<0 || (aw+qw)!==100){ toast(T("toast_weights_invalid")); return; }
  c.weights = {assignments:aw, quizzes:qw};
  toast(T("toast_weights_saved"));
  render();
}
</script>

/* A student may attempt a given quiz at most this many times — enforced in
   submitQuiz. Which of those attempts actually counts toward the grade is
   the teacher's call (see q.scoringPolicy / computeEffectiveQuizResult):
   "last" (default), "highest", or "lowest". */
const QUIZ_MAX_ATTEMPTS = 2;

/* Normalizes q.results[sid] into an attempts array regardless of whether it
   was written by the current code (which always keeps `.attempts`) or by
   older data saved before per-attempt tracking existed (a bare
   {score,total,answers} with no `.attempts` — treated as that student's
   one and only attempt so far). */
function quizAttemptsFor(q, sid){
  const r = q.results && q.results[sid];
  if(!r) return [];
  if(Array.isArray(r.attempts)) return r.attempts;
  return [{score:r.score, total:r.total, answers:r.answers, at:r.at || null}];
}

/* Picks which attempt "counts" per the quiz's scoring policy. Ties (e.g. two
   attempts with the same score) keep the earlier attempt, so the result is
   stable rather than flip-flopping as more attempts are added. */
function computeEffectiveQuizResult(q, attempts){
  if(!attempts.length) return null;
  const policy = q.scoringPolicy || "last";
  let chosen = attempts[attempts.length-1];
  if(policy==="highest") chosen = attempts.reduce((best,a)=> a.score>best.score ? a : best);
  else if(policy==="lowest") chosen = attempts.reduce((best,a)=> a.score<best.score ? a : best);
  return {score:chosen.score, total:chosen.total, answers:chosen.answers, at:chosen.at, attempts};
}

/* Recomputes and stores the effective result for one student from their
   full attempt history — called after a new attempt is submitted, and after
   the teacher changes the scoring policy (so past attempts get re-judged
   under the new rule instead of only affecting future ones). */
function recomputeQuizResult(q, sid){
  const attempts = quizAttemptsFor(q, sid);
  if(!attempts.length){ delete q.results[sid]; return; }
  q.results[sid] = computeEffectiveQuizResult(q, attempts);
}

function setQuizScoringPolicy(courseId, quizId, policy){
  const c = courseById(courseId), q = c.quizzes.find(x=>x.id===quizId);
  if(!q) return;
  q.scoringPolicy = policy;
  Object.keys(q.results||{}).forEach(sid=> recomputeQuizResult(q, sid));
  toast(T("toast_scoring_updated"));
  openManageQuizModal(courseId, quizId);
}

function openAddQuizModal(courseId){

  `);
}

  const due = document.getElementById("new-quiz-due").value;
  if(!title || !due){ toast(T("quiz_title_due_required")); return; }
